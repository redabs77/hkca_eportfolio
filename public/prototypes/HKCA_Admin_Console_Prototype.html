<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HKCA e-Portfolio · College Secretariat Console (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--g300:#d4d4d4;--am700:#8f5d12;--rd700:#ac3f4c;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg2);color:var(--ink);line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased;transition:background-color .15s,color .15s}
.mono{font-family:'JetBrains Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1420px;margin:0 auto;padding:0 22px}
.hidden{display:none!important}
button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}

/* top bar + tabs (same frame as the SOT console) */
.top{position:sticky;top:0;z-index:80;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px) saturate(180%);border-bottom:1px solid var(--border)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:11px 0}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none}
.brand h1{font-size:14.5px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
.brand p{font-size:12px;color:var(--ink3);line-height:1.2}
.top-right{display:flex;align-items:center;gap:9px}
.icon-btn{width:32px;height:32px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;display:grid;place-items:center;cursor:pointer;font-size:15px}
.icon-btn:hover{background:var(--bg3)}
.who{display:flex;align-items:center;gap:9px;padding-left:11px;border-left:1px solid var(--border)}
.who .nm{font-size:12.5px;font-weight:650;line-height:1.2;text-align:right}
.who .rl{font-size:12px;color:var(--ink3);line-height:1.2;text-align:right}
.av{width:31px;height:31px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:650;flex:none}
.sub{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:70}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;font-size:13px;font-weight:550;color:var(--ink2);padding:13px 15px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--acc-t);border-bottom-color:var(--acc);font-weight:650}
.cnt{background:var(--bg3);color:var(--ink2);font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;font-family:'JetBrains Mono',monospace;min-width:18px;text-align:center}
.cnt.hot{background:var(--wn-bg);color:var(--wn-f)}
main{padding:24px 0 90px}

/* page head */
.pghead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.pgtitle{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.pgsub{font-size:13.5px;color:var(--ink2);margin-top:3px;max-width:70ch}
.meta{font-size:12.5px;color:var(--ink2)}
.muted{color:var(--ink3)}
.h3{font-size:14px;font-weight:650;letter-spacing:-.01em}

/* controls */
.seg{display:inline-flex;gap:3px;background:var(--bg3);padding:3px;border-radius:10px;border:1px solid var(--border-sub);flex-wrap:wrap}
.seg button{border:0;background:transparent;font-size:12.5px;font-weight:550;color:var(--ink2);padding:6px 13px;border-radius:7px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:var(--shadow);font-weight:650}
.btn{border:0;font-size:12.5px;font-weight:650;padding:7px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .14s}
.btn.pri{background:var(--acc);color:#fff}.btn.pri:hover{background:var(--acc-d)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--border)}.btn.sec:hover{background:var(--bg3)}
.btn.out{background:transparent;color:var(--acc-t);border:1px solid var(--acc)}.btn.out:hover{background:var(--acc-bg)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:0;color:var(--acc-t);font-weight:600;font-size:inherit;cursor:pointer;padding:0;text-align:left}
.linkbtn:hover{text-decoration:underline}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;max-width:100%}
textarea{width:100%;resize:vertical;line-height:1.5}
select{padding-right:26px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld>label,.lab{font-size:12px;font-weight:650;color:var(--ink2)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--ink2);font-size:12.5px;font-weight:550;padding:5px 11px;border-radius:999px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip:hover{border-color:var(--ink3)}
.chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc-t);font-weight:650}
.chip .n{font-size:11px;font-family:'JetBrains Mono',monospace;opacity:.85}
.toolbar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .grow{flex:1}

/* surfaces */
.card{background:var(--raised);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{text-align:left;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg2);position:sticky;top:0}
thead th:first-child{border-top-left-radius:14px}thead th:last-child{border-top-right-radius:14px}
thead th button{all:unset;cursor:pointer;display:inline-flex;gap:5px;align-items:center;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}
thead th button:hover{color:var(--ink)}
thead th button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
tbody td{padding:10px 14px;border-bottom:1px solid var(--border-sub);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--bg2)}
td.act,th.act{text-align:right;white-space:nowrap}
.cell-name{font-weight:600}
.cell-sub{font-size:12px;color:var(--ink3);margin-top:1px}
.grp td{background:var(--bg2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);padding:8px 14px}
.empty{padding:34px 20px;text-align:center;color:var(--ink3);font-size:13px}

/* status vocabulary: one saturated pill per row at most; secondary states are dot + text */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-f)}.pill.warn{background:var(--wn-bg);color:var(--wn-f)}.pill.bad{background:var(--bd-bg);color:var(--bd-f)}.pill.info{background:var(--in-bg);color:var(--in-f)}.pill.pur{background:var(--pp-bg);color:var(--pp-f)}.pill.mute{background:var(--bg3);color:var(--ink2)}
.dt{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink)}
.dt::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.dt.ok::before{background:var(--ok-f)}.dt.warn::before{background:#d99a2b}.dt.bad::before{background:var(--bd-f)}.dt.info::before{background:var(--in-f)}.dt.none::before{background:transparent;border:1.5px dashed var(--ink3)}
.stg{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;font-family:'JetBrains Mono',monospace;color:#1f2a44}
.stg.BAT{background:var(--s-bat)}.stg.HAT{background:var(--s-hat)}.stg.PFY{background:var(--s-pfy)}
.dark .stg{color:#0f1226}
.tick{color:var(--ok-f);font-weight:800}.cross{color:var(--bd-f);font-weight:800}

/* home: work queue */
.hm{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.q-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--border)}
.q-item{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:16px;align-items:center;padding:15px 20px 15px 0;border-bottom:1px solid var(--border-sub)}
.q-item:last-child{border-bottom:0}
.q-bar{align-self:stretch;border-radius:0 4px 4px 0}
.q-title{font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.q-why{font-size:12.5px;color:var(--ink2);margin-top:2px}
.q-wait{padding:13px 20px;font-size:13px;color:var(--ink2);border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
.q-clear{padding:15px 20px;font-size:13px;color:var(--ink2)}
.rail-card{padding:16px 18px;margin-bottom:16px}
.cal{display:grid;grid-template-columns:54px 1fr;gap:4px 12px;margin-top:10px;font-size:13px}
.cal .d{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2)}
.cal .w{color:var(--ink)}
.cal .w small{display:block;color:var(--ink3);font-size:12px}
.sync-line{display:flex;gap:9px;align-items:center;font-size:13px;margin-top:8px}

/* drawer + modal + toast */
.scrim{position:fixed;inset:0;background:rgba(20,18,40,.42);z-index:120;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--border);z-index:130;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s ease;box-shadow:var(--shadow-md)}
.drawer.on{transform:none}
.dr-h{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.dr-h h2{font-size:18px;letter-spacing:-.015em;font-weight:700;line-height:1.25}
.dr-b{flex:1;overflow:auto;padding:18px 22px}
.dr-f{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;background:var(--bg)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px;margin-bottom:16px}
.kv dt{color:var(--ink3)}.kv dd{color:var(--ink)}
.sect{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:20px 0 8px}
.sect:first-child{margin-top:0}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:13px}
.chk:hover{background:var(--bg2)}
.chk input{margin-top:3px}
.chk small{display:block;color:var(--ink3);font-size:12px}
.chk.done{background:var(--ok-bg);border-color:transparent}
.sigrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;font-size:13px}
.sigrow small{display:block;color:var(--ink3);font-size:12px}
.sigrow.done{background:var(--ok-bg);border-color:transparent}
.sigrow .acts{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.rtrail{display:grid;grid-template-columns:56px 1fr;gap:8px 12px;font-size:13px;margin-bottom:8px}
.rtrail .rt-d{color:var(--ink3);font-variant-numeric:tabular-nums}
.chipgrp{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.chipgrp+.chipgrp{padding-left:14px;border-left:1px solid var(--border-sub)}
.note{font-size:12.5px;color:var(--ink2);background:var(--bg2);border:1px solid var(--border-sub);border-radius:10px;padding:10px 12px;margin:10px 0}
.note.warn{background:var(--wn-bg);color:var(--wn-f);border-color:transparent}
.note.bad{background:var(--bd-bg);color:var(--bd-f);border-color:transparent}
.note.ok{background:var(--ok-bg);color:var(--ok-f);border-color:transparent}
.modal-bg{position:fixed;inset:0;background:rgba(20,18,40,.5);z-index:150;display:none;place-items:center;padding:20px}
.modal-bg.on{display:grid}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-md);width:min(520px,100%);max-height:88vh;overflow:auto;padding:22px 24px}
.modal h3{font-size:17px;letter-spacing:-.015em;margin-bottom:6px}
.modal .btn-row{justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:550;z-index:200;opacity:0;pointer-events:none;transition:all .2s;max-width:min(560px,92vw)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.demo-btn{position:fixed;right:16px;bottom:16px;z-index:90}
.demo-pop{position:fixed;right:16px;bottom:56px;z-index:91;width:240px;padding:14px;display:none}
.demo-pop.on{display:block}

/* course rounds, projects, small bars */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.round{display:block;width:100%;text-align:left;border:0;background:transparent;padding:13px 16px;border-bottom:1px solid var(--border-sub);cursor:pointer;color:var(--ink)}
.round:last-child{border-bottom:0}
.round:hover{background:var(--bg2)}
.round.on{background:var(--acc-bg);box-shadow:inset 3px 0 0 var(--acc)}
.round b{font-size:13.5px}
.seatbar{height:6px;background:var(--bg3);border-radius:4px;margin-top:8px;overflow:hidden}
.seatbar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.seatbar i.full{background:var(--ok-f)}
.pri-h{font-weight:700}.pri-m{font-weight:600;color:var(--ink2)}.pri-l{color:var(--ink3)}
.steps{display:flex;gap:8px;margin-bottom:14px;font-size:12.5px;color:var(--ink3);flex-wrap:wrap}
.steps span{padding:3px 10px;border-radius:999px;background:var(--bg3)}
.steps span.on{background:var(--acc-bg);color:var(--acc-t);font-weight:650}
.steps span.done{background:var(--ok-bg);color:var(--ok-f);font-weight:650}
.crit{display:flex;gap:6px;flex-wrap:wrap}
.crit i{font-style:normal;font-size:11.5px;font-weight:650;padding:1px 7px;border-radius:6px;background:var(--bg3);color:var(--ink3)}
.crit i.ok{background:var(--ok-bg);color:var(--ok-f)}.crit i.no{background:var(--bd-bg);color:var(--bd-f)}
.log-row{display:grid;grid-template-columns:96px 1fr;gap:3px 12px;padding:10px 0;border-bottom:1px solid var(--border-sub);font-size:13px}
.log-row .t{color:var(--ink3);font-variant-numeric:tabular-nums}
.log-row .h{grid-column:2;font-size:12px;color:var(--ink3);font-family:'JetBrains Mono',monospace}
details.fold{border:1px solid var(--border);border-radius:12px;background:var(--raised);margin-top:16px}
details.fold>summary{cursor:pointer;padding:13px 18px;font-weight:650;font-size:13.5px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";color:var(--ink3);font-weight:700}
details.fold[open]>summary::after{content:"\2013"}
details.fold .in{padding:0 18px 14px}
table.dk{table-layout:fixed}
@media(max-width:1000px){.hm,.split{grid-template-columns:1fr}.kv{grid-template-columns:120px 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* phone layout (the console is built for a laptop, this keeps it readable on a phone) */
@media(max-width:720px){
  html,body{overflow-x:hidden}
  .wrap{padding:0 14px}
  .top-row{gap:8px;padding:9px 0}
  .brand{gap:9px;min-width:0}
  .brand h1{font-size:13.5px;white-space:nowrap}
  .brand p{display:none}
  .top-right{gap:7px}
  .top-right .btn{padding:6px 10px;font-size:12px;white-space:nowrap}
  .who{border-left:0;padding-left:0}.who .nm,.who .rl{display:none}
  .tab{padding:12px 12px 11px}
  .seg{display:flex;width:100%}.seg button{flex:1 1 auto;justify-content:center;padding:7px 10px}
  .toolbar>*{max-width:100%}
  .q-h{flex-wrap:wrap;gap:8px}
  .q-h .btn-row{flex-wrap:wrap;gap:8px}
  .kv{grid-template-columns:100px 1fr}
  .split>*{min-width:0}
  /* Training Progression: each trainee becomes a stacked card instead of four squeezed columns */
  table.dk,table.dk tbody,table.dk tr,table.dk td{display:block}
  table.dk colgroup{display:none}
  table.dk tr{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:8px;padding:12px 14px;border-bottom:1px solid var(--border-sub)}
  table.dk tr:last-child{border-bottom:0}
  table.dk td{border:0!important;padding:0!important;width:auto!important;grid-column:2;min-width:0}
  table.dk td:first-child{grid-column:1;grid-row:1}
  table.dk td:nth-child(2){grid-row:1}
  table.dk td:nth-child(3){margin-top:6px}
  table.dk td:nth-child(4){margin-top:8px}
  table.dk .crit{display:flex;flex-wrap:wrap;gap:5px}
  table.dk .cell-sub{overflow-wrap:anywhere}
  /* applicant list: name and request date on one line, priority below, decision full width */
  table.stk thead{display:none}
  table.stk,table.stk tbody,table.stk tr,table.stk td{display:block}
  table.stk tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--border-sub)}
  table.stk td{border:0!important;padding:0!important;min-width:0}
  table.stk td:nth-child(1){grid-column:1;grid-row:1}
  table.stk td:nth-child(2){grid-column:1/-1;grid-row:2}
  table.stk td:nth-child(3){grid-column:2;grid-row:1;text-align:right;white-space:nowrap}
  table.stk td:nth-child(3)::before{content:'Requested '}
  table.stk td:nth-child(4){grid-column:1/-1;grid-row:3;margin-top:6px}
  table.stk select{width:100%}
  /* every other list: one card per row, with the column heading as a small label */
  .tbl-scroll>table:not(.dk):not(.stk),.tbl-scroll>table:not(.dk):not(.stk) tbody,.tbl-scroll>table:not(.dk):not(.stk) tr{display:block}
  .tbl-scroll>table:not(.dk):not(.stk) thead{display:none}
  .tbl-scroll>table:not(.dk):not(.stk) tr{padding:12px 14px;border-bottom:1px solid var(--border-sub)}
  .tbl-scroll>table:not(.dk):not(.stk) tr:last-child{border-bottom:0}
  .tbl-scroll>table:not(.dk):not(.stk) td{display:block;position:relative;border:0!important;padding:4px 0 4px 100px!important;width:auto!important;min-width:0;min-height:26px}
  .tbl-scroll>table:not(.dk):not(.stk) td::before{content:attr(data-l);position:absolute;left:0;top:7px;width:90px;font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);line-height:1.25}
  .tbl-scroll>table:not(.dk):not(.stk) td:first-child,.tbl-scroll>table:not(.dk):not(.stk) td[data-l=""]{padding-left:0!important}
  .tbl-scroll>table:not(.dk):not(.stk) td:first-child::before,.tbl-scroll>table:not(.dk):not(.stk) td[data-l=""]::before{content:none}
  .tbl-scroll>table:not(.dk):not(.stk) td:empty{display:none}
  .tbl-scroll>table:not(.dk):not(.stk) td[colspan]{display:block}
  .tbl-scroll>table:not(.dk):not(.stk) td[colspan]::before{content:none}
}
.chk-list{list-style:none;margin:0;padding:0}.chk-list li{padding:9px 0;border-bottom:1px solid var(--border-sub)}
.chk-list li b{display:inline-block;min-width:58px;margin-right:8px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.chk-list li.ok b{color:var(--ok-f)}.chk-list li.bad b{color:var(--bd-f)}
@media(max-width:560px){.chk-list li b{display:block;margin:0 0 2px}}

function critOf(t){
  const g=S.GATES[t.stage];const d=S.dk[t.id]||{fail:{}};const f=d.fail;
  const need=g.next==='Exit'?['EASE','EMAC','ECHOA','ADAMA','UGRA']:g.next==='PFY'?['EASE','EMAC']:['EASE'];
  const miss=need.filter(c=>!t.courses.includes(c));
  const out={time:!f.time,courses:miss.length===0&&!f.courses,wba:!f.wba,vop:!f.vop,ita:!f.ita,exam:!f.exam};
  const why={time:f.time||'',courses:miss.length?CNAME[miss[0]]+(miss.length>1?' and '+(miss.length-1)+' more':'')+' outstanding':(f.courses||''),wba:f.wba||'',vop:f.vop||'',ita:f.ita||'',exam:f.exam||''};
  if(g.next==='Exit'){const cs=S.projects.filter(x=>x.trainee===t.id),met=cs.some(x=>x.manuscript&&x.manuscript.state==='approved');out.project=met||(!cs.length&&!f.project);why.project=out.project?'':(f.project||(cs.length?'Formal project manuscript not yet approved':'No formal project recorded'))}
  return {out,why,ready:Object.values(out).every(Boolean),miss};
}

/* membership application */
const CHK=[['mchk','Medical Council registration checked','Full or limited registration, current on the date of application. This is not a specialist registration.'],['fee','Application fee received','Matched to the payment record']];
const endOk=a=>!!(a.sig.cos&&a.sig.sot);
const intakeN=a=>(a.chk.mchk?1:0)+(a.chk.fee?1:0)+(endOk(a)?1:0);
const intakeDone=a=>intakeN(a)===3;
const SIGWHO={cos:'Chief of Service',sot:'SOT'};
function vIntake(){
  if(!S.intake.length)return `<div class="card"><div class="empty">No applications waiting. New ones from the online application form appear here.</div></div>`;
  return `<div class="card"><div class="tbl-scroll"><table><thead><tr><th>Applicant</th><th>Submitted</th><th>Checks</th><th class="act"></th></tr></thead><tbody>${S.intake.map(a=>{const n=intakeN(a);return `<tr><td><div class="cell-name">${esc(a.name)}</div><div class="cell-sub">${esc(a.from)}</div></td><td>${fmt(a.submitted)} <span class="cell-sub">waiting ${ago(days(a.submitted,TODAY))}</span></td><td>${dt(n+' of 3 checked',n===3?'ok':n?'warn':'none')}</td><td class="act"><button class="btn pri sm" data-a="openIntake" data-id="${a.id}">Review</button></td></tr>`}).join('')}</tbody></table></div></div>`;
}
function sigRow(a,w){
  const s=a.sig[w],who=SIGWHO[w]+', '+a.hosp;
  if(s)return `<div class="sigrow done"><div><b>${who}</b><small>${s.m==='esign'?'Signed electronically':'Signed PDF attached'}, ${fmtS(s.d)}</small></div><div class="acts"><button class="linkbtn" data-a="toast" data-m="${s.m==='esign'?'Opens the signature record (demo)':'Opens the signed PDF (demo)'}">${s.m==='esign'?'View signature record':'View PDF'}</button></div></div>`;
  return `<div class="sigrow"><div><b>${who}</b><small>Waiting for signature</small></div><div class="acts"><button class="btn sec sm" data-a="sigRemind" data-id="${a.id}" data-w="${w}">Send reminder</button><button class="linkbtn" data-a="sigPdf" data-id="${a.id}" data-w="${w}">Attach signed PDF instead</button></div></div>`;
}
function intakeBody(a){
  return `<div class="sect">Application</div><dl class="kv"><dt>Medical Council</dt><dd>${esc(a.mc.type)} registration, no. ${esc(a.mc.no)}</dd><dt>Applying as</dt><dd>${a.stage==='HAT'?'HAT, lateral transfer':'BAT, new entrant'}</dd></dl>
  <div class="sect">Checks</div>${CHK.map(([k,l,s])=>`<label class="chk ${a.chk[k]?'done':''}"><input type="checkbox" data-c="intakeChk" data-id="${a.id}" data-k="${k}" ${a.chk[k]?'checked':''}><span>${l}<small>${s}</small></span></label>`).join('')}
  <div class="sect">Endorsement ${endOk(a)?'<span class="meta">complete</span>':''}</div>${sigRow(a,'cos')}${sigRow(a,'sot')}
  <p class="meta">Both are sent a signing request when the application is submitted. They sign with their own portfolio login, as a trainee does for an ITA. If either cannot, attach their signed PDF instead.</p>
  <div class="sect">Account set-up</div>
  <div class="fld"><label for="inHosp">Parent hospital</label><select id="inHosp">${hospOpts(a.hosp)}</select></div>
  <div class="fld"><label for="inStage">Starting stage</label><select id="inStage"><option value="BAT" ${a.stage==='BAT'?'selected':''}>BAT, new entrant</option><option value="HAT" ${a.stage==='HAT'?'selected':''}>HAT, lateral transfer</option></select></div>
  <dl class="kv"><dt>Curriculum edition</dt><dd>2017 v1.1 (current)</dd><dt>HKCA number</dt><dd>Issued on approval</dd></dl>`;
}
function refreshIntake(a){
  const hs=$('#inHosp').value,st=$('#inStage').value;$('#drBody').innerHTML=intakeBody(a);$('#inHosp').value=hs;$('#inStage').value=st;$('#apprBtn').disabled=!intakeDone(a);render();
}
function sigRemind(id,w){const a=S.intake.find(x=>x.id===id);logAct('Signing reminder sent',`${a.name}: ${SIGWHO[w]}, ${a.hosp}`);toast('Reminder sent to the '+SIGWHO[w]+' at '+a.hosp+'.')}
function sigPdf(id,w){const a=S.intake.find(x=>x.id===id);a.sig[w]={m:'pdf',d:TODAY};logAct('Endorsement PDF attached',`${a.name}: ${SIGWHO[w]}, ${a.hosp}`);refreshIntake(a);toast('Signed PDF recorded for the '+SIGWHO[w]+'.')}
function simSign(){S.intake.forEach(a=>['cos','sot'].forEach(w=>{if(!a.sig[w])a.sig[w]={m:'esign',d:TODAY}}));save();$('#demoPop').classList.remove('on');if(ui.dr&&ui.dr.type==='intake'){const a=S.intake.find(x=>x.id===ui.dr.id);if(a)refreshIntake(a);else render()}else render();toast('Pending signatures arrived (demo).')}
function openIntake(id){
  const a=S.intake.find(x=>x.id===id);ui.dr={type:'intake',id};
  openDrawer(a.id,a.name,intakeBody(a),`<button class="btn sec" data-a="returnIntake" data-id="${id}">Return to applicant</button><button class="btn pri" id="apprBtn" data-a="approveIntake" data-id="${id}" ${intakeDone(a)?'':'disabled'}>Approve and open account</button>`);
}
function approveIntake(id){
  const a=S.intake.find(x=>x.id===id);const hosp=$('#inHosp').value,stage=$('#inStage').value;
  const num='HKCA-2026-'+String(40+S.trainees.filter(t=>t.id.startsWith('HKCA-2026')).length+1).padStart(3,'0');
  S.trainees.unshift({id:num,name:a.name,stage,months:0,hosp,status:'Active',edition:'2017 v1.1',start:TODAY,courses:[],exam:{},mc:a.mc});
  S.intake=S.intake.filter(x=>x.id!==id);logAct('Membership approved',`${a.name} became ${num}, ${stage} at ${hosp}, curriculum 2017 v1.1`);closeDrawer();render();
  openModal(`<h3>Account opened for ${esc(a.name)}</h3><dl class="kv" style="margin-top:12px"><dt>HKCA number</dt><dd class="mono">${num}</dd><dt>Stage</dt><dd>${stage}</dd><dt>Parent hospital</dt><dd>${hosp}, ${CLUSTER[hosp]}</dd><dt>Curriculum edition</dt><dd>2017 v1.1</dd><dt>Ledger</dt><dd>Opened at 0 months</dd><dt>Signed off</dt><dd>Secretariat, ${fmtS(TODAY)}</dd></dl><p class="meta">A welcome email with a one-time set-password link is queued to the address on the application. No password is sent. The SOT at ${hosp} sees the trainee on their next load.</p><div class="btn-row"><button class="btn pri" data-a="closeModal">Done</button></div>`);
}
function returnIntake(id){
  const a=S.intake.find(x=>x.id===id);
  openModal(`<h3>Return ${esc(a.name)}'s application</h3><p class="meta" style="margin-bottom:12px">The applicant sees your note and can resubmit.</p><div class="fld"><label for="rtWhy">What is missing or wrong</label><textarea id="rtWhy" rows="3"></textarea></div><div class="btn-row"><button class="btn sec" data-a="closeModal">Cancel</button><button class="btn pri" data-a="doReturn" data-id="${id}">Return application</button></div>`);
}
function doReturn(id){const w=$('#rtWhy').value.trim();if(!w){toast('Say what needs fixing.');return}const a=S.intake.find(x=>x.id===id);S.intake=S.intake.filter(x=>x.id!==id);logAct('Membership application returned',`${a.name}: ${w}`);closeModal();closeDrawer();render();toast('Application returned to '+a.name+'.')}

/* docket */
const CRIT=[['time','Time'],['courses','Courses'],['wba','WBA'],['vop','Logbook'],['ita','ITA'],['exam','Exam']];
const critFor=t=>S.GATES[t.stage].next==='Exit'?[...CRIT,['project','Formal project']]:CRIT;
const CG='<colgroup><col style="width:48px"><col style="width:27%"><col style="width:22%"><col></colgroup>';
const GK=['BAT','HAT','PFY'];
const dkInScope=x=>ui.dkGate==='All'||x.t.stage===ui.dkGate;
const dkVisible=()=>docketRows().filter(x=>dkInScope(x)&&(ui.dkStat==='All'||(ui.dkStat==='ready')===x.c.ready));
const dkSelected=()=>dkVisible().filter(x=>x.c.ready&&ui.docketSel[x.t.id]).map(x=>x.t.id);
function vDocket(){
  const all=docketRows();const vis=dkVisible();const sel=dkSelected();
  const crit=(c,t)=>`<div class="crit">${critFor(t).map(([k,l])=>`<i class="${c.out[k]?'ok':'no'}">${c.out[k]?'\u2713':'\u2715'} ${l}</i>`).join('')}</div>`;
  const row=(x,r)=>{const g=S.GATES[x.t.stage];const out=critFor(x.t).filter(([k])=>!x.c.out[k]);return `<tr>${r?`<td style="width:34px"><input type="checkbox" data-c="dkSel" data-id="${x.t.id}" ${ui.docketSel[x.t.id]?'checked':''} aria-label="Select ${esc(x.t.name)}"></td>`:'<td></td>'}<td><div class="cell-name">${esc(x.t.name)}</div><div class="cell-sub">${x.t.hosp} <span class="mono">${x.t.id}</span></div></td><td>month ${x.t.months} of ${g.to}<div class="cell-sub">${r?dt('Ready to advance','ok'):dt(out.length+' outstanding','warn')}</div></td><td>${r?crit(x.c,x.t):`<div>${out.map(([k,l])=>`<div class="cell-sub" style="color:var(--bd-f)"><b>${l}:</b> ${esc(x.c.why[k])}</div>`).join('')}</div>`}</td></tr>`};
  const gcard=g=>{const G=S.GATES[g];const rows=vis.filter(x=>x.t.stage===g);const rd=rows.filter(x=>x.c.ready),at=rows.filter(x=>!x.c.ready);
    if(!rows.length&&ui.dkStat!=='All')return '';
    return `<div class="card" style="margin-bottom:18px"><div class="q-h"><div class="h3">${G.label} <span class="cnt">${rows.length}</span></div><div class="btn-row"><span class="meta">${rd.length} ready, ${at.length} need attention. Window: month ${G.from} to ${G.to}.</span><button class="btn sec sm" data-a="dkAll" data-g="${g}" ${rd.length?'':'disabled'}>Select all ready</button></div></div>
    <div class="tbl-scroll"><table class="dk">${CG}<tbody>${(rd.map(x=>row(x,true)).join('')+at.map(x=>row(x,false)).join(''))||'<tr><td colspan="4" class="empty">Nobody is in this gate window.</td></tr>'}</tbody></table></div></div>`};
  const gn=g=>all.filter(x=>g==='All'||x.t.stage===g).length;
  const sn=k=>all.filter(x=>dkInScope(x)&&(k==='All'||(k==='ready')===x.c.ready)).length;
  const gates=ui.dkGate==='All'?GK:[ui.dkGate];
  const cards=gates.map(gcard).join('');
  return `<div class="toolbar"><div class="chipgrp" role="group" aria-label="Gate">${['All',...GK].map(g=>`<button class="chip ${ui.dkGate===g?'on':''}" aria-pressed="${ui.dkGate===g}" data-a="fDkGate" data-v="${g}">${g==='All'?'All gates':S.GATES[g].label} <span class="n">${gn(g)}</span></button>`).join('')}</div>
  <div class="chipgrp" role="group" aria-label="Status">${[['All','Everyone'],['ready','Ready'],['attn','Needs attention']].map(([k,l])=>`<button class="chip ${ui.dkStat===k?'on':''}" aria-pressed="${ui.dkStat===k}" data-a="fDkStat" data-v="${k}">${l} <span class="n">${sn(k)}</span></button>`).join('')}</div>
  <span class="grow"></span><button class="btn pri sm" data-a="dkGo" ${sel.length?'':'disabled'}>Advance ${sel.length||''} selected</button></div>
  ${cards.trim()?cards:'<div class="card"><div class="empty">Nobody matches these filters.</div></div>'}
  <p class="meta" style="margin-top:12px">Criteria shown are illustrative. The real thresholds come from the curriculum edition each trainee is bound to.</p>`;
}
function dkGo(){
  const ids=dkSelected();const ts=ids.map(T).filter(Boolean);
  openModal(`<h3>Advance ${plural(ts.length,'trainee')}?</h3><p class="meta" style="margin:6px 0 12px">Each trainee moves to the next stage today and is notified. Stage history keeps the date and who made the change.</p><ul style="padding-left:18px;font-size:13px;line-height:1.8">${ts.map(t=>`<li>${esc(t.name)}: ${t.stage} &rarr; ${S.GATES[t.stage].next==='Exit'?'completed training':S.GATES[t.stage].next}</li>`).join('')}</ul><div class="btn-row"><button class="btn sec" data-a="closeModal">Cancel</button><button class="btn pri" data-a="dkDo">Advance</button></div>`);
}
function dkDo(){
  const ids=dkSelected();
  ids.forEach(id=>{const t=T(id);if(!t)return;const g=S.GATES[t.stage];if(g.next==='Exit'){t.status='Completed'}else{t.stage=g.next}logAct('Stage advanced',`${t.name} (${t.id}): ${g.label}`)});
  ui.docketSel={};closeModal();render();toast(plural(ids.length,'trainee')+' advanced.')
}

/* recognition */
const RSTATE={gate:['Request access','info'],waiting:['With applicant','mute'],docs:['Check documents','warn'],to:['With Training Officer','mute'],board:['Needs Board decision','warn'],approved:['Approved, credit to execute','info'],done:['Credit executed','ok']};
const srcTxt=r=>r.origin.kind==='overseas'?'Anaesthesia training overseas: '+r.origin.where:'Other specialty: '+r.origin.spec+', '+r.origin.where;
const DOCREQ=['Letter or certificate from the previous training body','Record of posts held, with dates','Logbook or case summary'];
const reasonOf=r=>r.origin.kind==='overseas'?'RETROSPECTIVE_OVERSEAS_RECOGNITION':'RETROSPECTIVE_SPECIALTY_TRANSFER';
const rtr=(r,who,ev,note)=>{r.trail.push({d:TODAY,who,ev,note:note||''})};
const rtrailHtml=r=>`<div class="sect">Decision trail</div><div class="rtrail">${r.trail.map(x=>`<div class="rt-d">${fmtS(x.d)}</div><div><b>${esc(x.ev)}</b> <span class="meta">${esc(x.who)}</span>${x.note?`<div class="meta">${esc(x.note)}</div>`:''}</div>`).join('')}</div>`;
const monthFields=(p,v,ro)=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px"><div class="fld"><label for="${p}CA">Clinical anaesthesia (months)</label><input type="number" id="${p}CA" min="0" max="72" value="${v.CA}" ${ro?'disabled':''}></div><div class="fld"><label for="${p}ICU">Intensive care (months)</label><input type="number" id="${p}ICU" min="0" max="6" value="${v.ICU}" ${ro?'disabled':''}></div><div class="fld"><label for="${p}EL">Elective (months)</label><input type="number" id="${p}EL" min="0" max="18" value="${v.EL}" ${ro?'disabled':''}></div><div class="fld"><label for="${p}CS">Logbook cases recognised</label><input type="number" id="${p}CS" min="0" value="${v.cases}" ${ro?'disabled':''}></div></div>`;
const readM=p=>({CA:+$('#'+p+'CA').value||0,ICU:+$('#'+p+'ICU').value||0,EL:+$('#'+p+'EL').value||0,cases:+$('#'+p+'CS').value||0});
const recReq=r=>r.req?`<div class="sect">Requested by the applicant</div><dl class="kv"><dt>Clinical anaesthesia</dt><dd>${r.req.CA} months</dd><dt>Intensive care</dt><dd>${r.req.ICU} months</dd><dt>Elective</dt><dd>${r.req.EL} months</dd><dt>Logbook cases</dt><dd>${r.req.cases}</dd></dl>`:'';
function recDocs(r,edit){
  const req=DOCREQ;
  return `<div class="sect">Documents</div>${req.map((n,i)=>edit?`<label class="chk ${r.rc[i]?'done':''}"><input type="checkbox" data-c="recRc" data-id="${r.id}" data-i="${i}" ${r.rc[i]?'checked':''}><span>${n}<small>Received and readable</small></span></label>`:`<div class="chk ${r.rc[i]?'done':''}" style="cursor:default"><span>${n}${r.rc[i]?'':'<small>Not received</small>'}</span></div>`).join('')}<p class="meta"><button class="linkbtn" data-a="toast" data-m="Opens the uploaded documents (demo)">View uploaded documents</button></p>`;
}
function vRecog(){
  const act={gate:['Enable application','pri'],waiting:['View','sec'],docs:['Check documents','pri'],to:['View','sec'],board:['Record decision','pri'],approved:['Execute credit','pri'],done:['View','sec']};
  return `<div class="card"><div class="tbl-scroll"><table><thead><tr><th>Applicant</th><th>Prior training</th><th>Status</th><th class="act"></th></tr></thead><tbody>${S.recog.map(r=>{const a=act[r.state];return `<tr><td><div class="cell-name">${esc(r.name)}</div><div class="cell-sub mono">${r.id}</div></td><td>${esc(srcTxt(r))}</td><td>${pill(RSTATE[r.state][0],RSTATE[r.state][1])}</td><td class="act"><button class="btn ${a[1]} sm" data-a="openRecog" data-id="${r.id}">${a[0]}</button></td></tr>`}).join('')}</tbody></table></div></div>`;
}
function openRecog(id){
  const r=S.recog.find(x=>x.id===id);ui.dr={type:'recog',id};
  const sinceL={gate:'Asked',waiting:'Application enabled',docs:'Submitted',to:'Sent to Training Officer',board:'Referred to the Board',approved:'Approved by Training Officer',done:'Decided'}[r.state];
  const since=r.state==='approved'?r.grant.date:r.state==='done'?r.credit.date:r.asked;
  const top=`<dl class="kv"><dt>Prior training</dt><dd>${esc(srcTxt(r))}</dd><dt>${sinceL}</dt><dd>${fmt(since)}</dd></dl>`;
  let body='',foot='';
  if(r.state==='gate'){body=top+`<p class="note">The trainee cannot apply for retrospective recognition until you enable the application for them. After that they upload documents and state what they are asking for.</p>`;foot=`<button class="btn sec" data-a="closeDrawer">Cancel</button><button class="btn pri" data-a="unlockRecog" data-id="${id}">Enable application</button>`}
  else if(r.state==='waiting'){body=top+`<p class="note">Waiting for the applicant to upload documents. This moves to your list when they submit.</p>`}
  else if(r.state==='docs'){body=top+(r.toNote?`<p class="note warn"><b>The Training Officer asked for more documents:</b> ${esc(r.toNote)}</p>`:'')+recReq(r)+recDocs(r,true)+`<p class="meta">When every document is in, send the pack to the Training Officer to vet.</p>`;foot=`<button class="btn sec" data-a="returnRecog" data-id="${id}">Return to applicant</button><button class="btn pri" id="sendToBtn" data-a="sendTO" data-id="${id}" ${r.rc.every(Boolean)?'':'disabled'}>Send to Training Officer</button>`}
  else if(r.state==='to'){body=top+recReq(r)+recDocs(r,false)+`<p class="note">With the Training Officer. It returns here only if they refer it to the Board or ask for more documents. If they approve, it comes to you to execute the credit.</p>`;foot=`<button class="btn sec" data-a="closeDrawer">Close</button><button class="btn sec" data-a="openToForm" data-id="${id}" data-b="1">Record outcome for them</button>`}
  else if(r.state==='board'||r.state==='approved'){
    const ap=r.state==='approved';const v=ap?r.grant:r.req;
    body=top+recReq(r)+recDocs(r,false)+`<div class="sect">${ap?'Training Officer\'s decision':'Board decision'}</div>${ap?`<p class="note ok">No particular issues were raised, so the Training Officer's vetting is the decision. Check the figures and execute.</p>`:(r.referNote?`<p class="note warn"><b>Referred by the Training Officer:</b> ${esc(r.referNote)}</p>`:'')}${monthFields('g',v,ap)}<div class="fld"><label for="gDate">Date of ${ap?'the Training Officer\'s':'the Board'} decision</label><input type="date" id="gDate" max="${TODAY}" value="${ap?r.grant.date:TODAY}" ${ap?'disabled':''}></div><dl class="kv"><dt>Reason code</dt><dd class="mono" style="font-size:12px">${reasonOf(r)}</dd></dl>`+rtrailHtml(r);
    foot=`<button class="btn sec" data-a="closeDrawer">Cancel</button><button class="btn pri" data-a="reviewCredit" data-id="${id}">Review and execute</button>`}
  else{const c=r.credit;body=top+`<dl class="kv"><dt>Decided by</dt><dd>${esc(c.by||'Board')}</dd><dt>Reason code</dt><dd class="mono" style="font-size:12px">${c.reason}</dd></dl><div class="sect">Credit written to the ledger</div><dl class="kv"><dt>Clinical anaesthesia</dt><dd>${c.CA} months</dd><dt>Intensive care</dt><dd>${c.ICU} months</dd><dt>Elective</dt><dd>${c.EL} months</dd><dt>Logbook cases</dt><dd>${c.cases}</dd></dl><p class="note">Ledger rows are permanent. A later correction is a new row with its own reason code, approved by the Board.</p>`}
  if(r.state!=='board'&&r.state!=='approved')body+=rtrailHtml(r);
  openDrawer(r.id,r.name,body,foot);
}
function refreshRecog(r){openRecog(r.id);render()}
function unlockRecog(id){const r=S.recog.find(x=>x.id===id);r.state='waiting';r.asked=TODAY;rtr(r,'Secretariat','Application enabled');logAct('Retrospective application enabled',r.name);closeDrawer();render();toast('Application enabled for '+r.name+'.')}
function sendTO(id){const r=S.recog.find(x=>x.id===id);if(!r.rc.every(Boolean))return;r.state='to';r.asked=TODAY;r.toNote='';rtr(r,'Secretariat','Documents checked, sent to the Training Officer');logAct('Sent to Training Officer',r.name+', '+srcTxt(r));closeDrawer();render();toast('Sent to the Training Officer.')}
function returnRecog(id){const r=S.recog.find(x=>x.id===id);openModal(`<h3>Return ${esc(r.name)}'s documents</h3><p class="meta" style="margin-bottom:12px">The applicant sees your note and can upload again.</p><div class="fld"><label for="rcWhy">What is missing or unreadable</label><textarea id="rcWhy" rows="3"></textarea></div><div class="btn-row"><button class="btn sec" data-a="closeModal">Cancel</button><button class="btn pri" data-a="doRecogReturn" data-id="${id}">Return to applicant</button></div>`)}
function doRecogReturn(id){const w=$('#rcWhy').value.trim();if(!w){toast('Say what is missing.');return}const r=S.recog.find(x=>x.id===id);r.state='waiting';r.asked=TODAY;rtr(r,'Secretariat','Returned to the applicant',w);logAct('Retrospective documents returned',r.name+': '+w);closeModal();closeDrawer();render();toast('Returned to '+r.name+'.')}
function simSubmit(){S.recog.forEach(r=>{if(r.state==='waiting'){r.state='docs';r.asked=TODAY;r.req=r.req||{CA:6,ICU:0,EL:0,cases:60};r.rc=[false,false,false];rtr(r,r.name,'Submitted form and documents')}});save();$('#demoPop').classList.remove('on');closeDrawer();render();toast('Applicants submitted (demo).')}

/* Training Officer */
const toDone=r=>['approved','board','done'].includes(r.state)&&r.trail.some(x=>/Training Officer/.test(x.who));
const toOutcome=r=>{const x=[...r.trail].reverse().find(y=>/Training Officer/.test(y.who));return x?x.ev:''};
function toTab(){const n=S.recog.filter(r=>r.state==='to').length;return `<button class="tab on" role="tab" aria-selected="true">Retrospective vetting${n?` <span class="cnt hot">${n}</span>`:''}</button>`}
function roleChrome(){const m={admin:['College Secretariat Console','College Secretariat','Administrator','CS'],to:['Training Officer view','Training Officer','Retrospective vetting','TO'],sot:['Supervisor of Training view','Supervisor of Training','Exam endorsements','ST']}[ui.role]||['College Secretariat Console','College Secretariat','Administrator','CS'];$('#brandSub').textContent=m[0];$('#whoNm').textContent=m[1];$('#whoRl').textContent=m[2];$('#whoAv').textContent=m[3];$('#roleSel').value=ui.role}
function vTO(){
  const to=S.recog.filter(r=>r.state==='to'),dn=S.recog.filter(toDone);
  return head('Training Officer','Retrospective vetting','Applications the Secretariat has checked and sent to you. Approve when there are no particular issues. Refer to the Board when there is a problem.')+

const PR={h:['High','pri-h'],m:['Medium','pri-m'],l:['Low','pri-l'],n:['Standard','pri-l']};

function rState(r){
  if(r.recorded)return 'recorded';
  if(rEnd(r)<TODAY)return 'held';

function rPill(r){

  if(s==='open')return pill('Open until '+fmtS(r.closes),'ok');
  if(s==='closed'){const u=undecided(r);return u?pill('Closed, '+u+' to decide','warn'):pill('Closed','mute')}
  if(s==='held')return pill('Held, record attendance','warn');
  return pill('Attendance recorded','mute');
}
function prio(id,course){
  const t=T(id);if(!t)return ['l','Not on file'];
  if(course==='EASE')return t.stage==='BAT'?['h','Needed early in basic training']:['m','Past the usual stage'];
  if(course==='EMAC'||course==='ECHOA')return t.stage==='BAT'?['l','Not yet needed']:['h','Needed before the exit examination'];
  return t.stage==='PFY'?['h','Few sittings left before exit']:t.stage==='HAT'?['m','Needed before the exit examination']:['l','Not yet needed'];
}
function aboutToProgress(t,key){
  if(!isMand(key)||t.status!=='Active')return null;
  const g=S.GATES[t.stage];if(!g||t.months<g.from||t.months>g.to)return null;
  return critOf(t).miss.includes(key)?g.label:null;
}
const wlBefore=(r,id)=>S.rounds.some(x=>x.course===r.course&&x.id!==r.id&&x.date<r.date&&x.apps.some(a=>a[0]===id&&a[2]==='Waitlisted'));
function appInfo(r,a){
  const t=T(a[0]);const wl=wlBefore(r,a[0]);const pg=t?aboutToProgress(t,r.course):null;
  if(r.rank==='fcfs')return {lvl:wl?'h':'n',why:wl?['Waitlisted for an earlier round']:[],score:wl?100:0,wl,pg:null};
  const ix=r.course==='IMV'&&HKC.exEntered(a[0],'Intermediate');
  let lvl='n',base='';if(isMand(r.course)){const p=prio(a[0],r.course);lvl=p[0];base=p[1]}
  if(wl||pg||ix)lvl='h';
  const why=[];if(wl)why.push('Waitlisted for an earlier round');if(pg)why.push('About to progress ('+pg+')');if(ix)why.push('Sitting the coming Intermediate examination');if(base&&!pg)why.push(base);
  const score=(wl?100:0)+(ix?80:0)+(pg?50:0)+{h:30,m:20,n:15,l:10}[lvl];
  return {lvl,why,score,wl,pg};
}

  <div class="q-wait">${over?`<b>${accepted(r)} accepted for ${r.seats} seats.</b> You can keep this, or change a decision.`:full?'All seats are taken. You can still accept more, waitlist or reject.':'Waitlisted trainees are tagged as priority when the next round of this course opens.'}</div></div></div>`;
}
function suggestPlan(r){
  const todo=sortedApps(r).filter(a=>a.st==='Requested');let free=r.seats?Math.max(0,r.seats-accepted(r)):Infinity;const acc=[],wl=[];
  todo.forEach(a=>{if(free>0){acc.push(a);free--}else wl.push(a)});return {acc,wl};
}
function suggestSeats(){
  const r=S.rounds.find(x=>x.id===ui.round);const p=suggestPlan(r);
  if(!p.acc.length&&!p.wl.length){toast('Nobody is waiting for a decision.');return}
  const li=a=>{const t=T(a.id);return `<li><b>${esc(t?t.name:a.id)}</b> <span class="meta">${a.p.why.length?esc(a.p.why[0]):'No special priority'}</span></li>`};
  openModal(`<h3>Suggested decisions</h3><p class="meta" style="margin:6px 0 12px">${r.rank==='fcfs'?'Ordered first come, first served, with anyone waitlisted last time first.':'Ordered by priority, then by request time.'} Nothing changes until you apply, and you can still change any row afterwards. Rejections are never suggested.</p>
  <div class="sect" style="margin-top:0">Would accept (${p.acc.length})</div><ul style="margin:6px 0 12px 18px;font-size:13px;display:grid;gap:4px">${p.acc.map(li).join('')||'<li class="meta">None</li>'}</ul>
  <div class="sect" style="margin-top:0">Would waitlist (${p.wl.length})</div><ul style="margin:6px 0 4px 18px;font-size:13px;display:grid;gap:4px">${p.wl.map(li).join('')||'<li class="meta">None</li>'}</ul>
  <div class="btn-row"><button class="btn sec" data-a="closeModal">Cancel</button><button class="btn pri" data-a="applySuggest">Apply this suggestion</button></div>`);
}
function applySuggest(){
  const r=S.rounds.find(x=>x.id===ui.round);const p=suggestPlan(r);
  p.acc.forEach(a=>{r.apps[a.i][2]='Accepted'});p.wl.forEach(a=>{r.apps[a.i][2]='Waitlisted'});
  logAct('Seat suggestion applied',`${CNAME[r.course]} ${fmt(r.date)}: ${p.acc.length} accepted, ${p.wl.length} waitlisted, as reviewed by the Secretariat. Notices of acceptance queued by email`);closeModal();render();toast(p.acc.length+' accepted, '+p.wl.length+' waitlisted.');
}

function attendRounds(){return S.rounds.filter(r=>['held','recorded'].includes(rState(r))).sort((a,b)=>a.date<b.date?1:-1)}
function noticeTo(t){const s=S.appts.find(a=>a.hosp===t.hosp&&a.role==='SOT'&&(!a.until||a.until>=TODAY));return 'the Chief of Service, '+t.hosp+(s?' and the SOT, '+s.who:' and the SOT')}
function vAttend(){

  if(!ui.cn||!done.find(x=>x.id===ui.cn))ui.cn=done[0].id;

  <p class="meta" style="margin-bottom:12px">College rule: <b>70% or more</b> earns the Certificate of Attendance. Below 70% gets no certificate. Below <b>50%</b> is reported to the trainee's Chief of Service and SOT. After the number, add a comma and the attendance rate if the trainee missed sessions, for example <span class="mono">HKCA-2022-006, 60</span>. A line with no rate means full attendance.</p>
  <div class="fld"><label for="sheet">HKCA numbers from the attendance sheet, one per line</label><textarea id="sheet" rows="7" class="mono" style="font-size:12.5px">${esc(ui.sheet==null?'':ui.sheet)}</textarea></div>
  <div class="btn-row"><button class="btn sec" data-a="loadSheet">Load a sample sheet</button><button class="btn pri" data-a="checkSheet">Check the sheet</button></div></div>
  ${rows?attendOut(r,rows):''}`;
}
function attendOut(r,rows){
  const n=k=>rows.filter(x=>x.k===k).length;const nOk=n('ok'),nW=n('warn'),nS=n('skip'),nE=n('err'),nB=n('below');
  const inc=nOk+rows.filter(x=>x.k==='warn'&&x.on).length,n50=rows.filter(x=>x.k==='below'&&x.rate<50).length,tot=inc+nB;
  const tone=x=>x.k==='below'?(x.rate<50?'bad':'warn'):{ok:'ok',warn:'warn',skip:'none',err:'bad'}[x.k];
  return `<div class="card" style="margin-top:18px"><div class="q-h"><div><div class="h3">Check result</div><div class="meta">${nOk} ready &middot; ${nW} need your decision &middot; ${nB} below 70% &middot; ${nS} already done &middot; ${nE} not recognised</div>${nB?`<div class="meta" style="margin-top:4px">${inc} will ${isMand(r.course)?'be marked completed':'be marked as attended'}. ${nB} below 70% get no certificate${n50?`; ${n50} below 50% will be reported to the Chief of Service and SOT`:''}.</div>`:''}</div><button class="btn pri sm" data-a="commitSheet" ${tot?'':'disabled'}>Record attendance${tot?' for '+tot:''}</button></div>
  <div class="tbl-scroll"><table><thead><tr><th></th><th>Number</th><th>Trainee</th><th>Result</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td style="width:34px">${x.k==='warn'?`<input type="checkbox" data-c="warnOn" data-i="${i}" ${x.on?'checked':''} aria-label="Include ${esc(x.id)}">`:''}</td><td class="mono">${esc(x.id)}</td><td>${esc(x.name||'')}</td><td>${dt(x.msg,tone(x))}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function checkSheet(){
  const r=S.rounds.find(x=>x.id===ui.cn);ui.sheet=$('#sheet').value;
  const seen={};const rows=ui.sheet.split(/\n/).map(s=>s.trim()).filter(Boolean).map(line=>{
    const p=line.split(/[\s,;]+/).filter(Boolean);const id=p[0];let rate=100,stated=false;
    const t=T(id);if(!t)return {id,k:'err',msg:'Not a known HKCA number'};
    if(p.length>1){const v=parseFloat(p[1].replace('%',''));if(p.length>2||isNaN(v)||v<0||v>100)return {id,name:t.name,k:'err',msg:'Attendance rate not understood. Use a number from 0 to 100.'};rate=v;stated=true}
    if(seen[id])return {id,name:t.name,k:'skip',msg:'Listed twice on the sheet'};seen[id]=1;
    if(isMand(r.course)&&t.courses.includes(r.course))return {id,name:t.name,k:'skip',msg:'Already has '+CNAME[r.course]+' recorded'};
    if((r.attended||[]).includes(id))return {id,name:t.name,k:'skip',msg:'Already recorded for this round'};
    if(rate<70)return {id,name:t.name,k:'below',rate,msg:'Attendance '+rate+'%. Below 70%: no certificate'+(isMand(r.course)?' and not marked completed':'')+(rate<50?'. Chief of Service and SOT will be told':'')};
    const a=r.apps.find(x=>x[0]===id);const rt=stated?' ('+rate+'%)':'';
    if(a&&a[2]==='Accepted')return {id,name:t.name,rate,k:'ok',msg:(isMand(r.course)?'Accepted for this round. Will be marked completed':'Accepted for this round. Will be marked as attended')+rt};
    return {id,name:t.name,rate,k:'warn',on:false,msg:(a?'Was '+a[2].toLowerCase()+' for this round. Tick to include':'Never applied for this round. Tick to include')+rt};
  });
  ui.sheetOut={round:r.id,rows};render();
}
function commitSheet(){
  const r=S.rounds.find(x=>x.id===ui.cn);const all=ui.sheetOut.rows;
  const good=all.filter(x=>x.k==='ok'||(x.k==='warn'&&x.on)),below=all.filter(x=>x.k==='below');
  if(isMand(r.course))good.forEach(x=>{T(x.id).courses.push(r.course)});
  r.att=r.att||{};good.concat(below).forEach(x=>{r.att[x.id]=x.rate});
  r.attended=(r.attended||[]).concat(good.map(x=>x.id));r.recorded=TODAY;
  S.notices=S.notices||[];let nn=0;
  below.filter(x=>x.rate<50).forEach(x=>{const t=T(x.id);S.notices.push({d:TODAY,id:x.id,round:r.id,rate:x.rate});nn++;logAct('Attendance below 50%',`${t.name} (${x.id}), ${CNAME[r.course]} ${fmt(r.date)}: ${x.rate}%. Notice queued to ${noticeTo(t)}`)});
  logAct('Course attendance recorded',`${CNAME[r.course]} ${fmt(r.date)}: ${good.length} ${isMand(r.course)?'marked completed':'marked as attended'}, ${below.length} below 70% without certificate`);
  ui.sheetOut=null;ui.sheet=null;render();
  toast(plural(good.length,'trainee')+(isMand(r.course)?' marked completed':' marked as attended')+(below.length?'. '+below.length+' below 70%':'')+(nn?'. '+plural(nn,'notice')+' queued.':'.'))
}

function saveSit(id){
  const s=id?exSit(id):null,fin=exName()==='Final',g=k=>{const e=$('#'+k);return e?e.value.trim():''};
  const name=g('sfName'),opens=g('sfOpens'),closes=g('sfCloses'),mcq=g('sfMcq'),written=g('sfWritten'),oral=g('sfOral'),oralEnd=g('sfOralEnd'),osce=g('sfOsce'),fee=+g('sfFee');
  if(!name||!opens||!closes||!written||!oral){toast('Enter the name, the opening and closing dates, the written date and the oral date.');return}
  if(closes<opens){toast('The closing date must be after the opening date.');return}
  const first=mcq&&mcq<written?mcq:written,w=days(closes,first);
  if(w<21||w>56){toast('The closing date must be 3 to 8 weeks before the written examination. This one is '+plural(w,'day')+' before.');return}
  if(oral<=written){toast('The oral examination follows the written examination.');return}
  if(oralEnd&&oralEnd<oral){toast('The last oral day cannot be before the first.');return}
  if(fin&&osce&&osce<oral){toast('The OSCE follows the written examination.');return}
  if(!(fee>0)){toast('Enter the examination fee.');return}
  if(s){Object.assign(s,{name,opens,closes,written,oral,oralEnd:oralEnd||'',fee});if(fin){s.mcq=mcq||'';s.osce=osce||''}logAct('Exam sitting edited',`${s.exam} ${name}: closes ${fmt(closes)}, fee ${HKC.hk(fee)}`)}

function saveElig(id){
  const t=T(id),rf=$('#elRf').checked,tf=$('#elTf').checked,ex=$('#elEx').value,why=$('#elWhy').value.trim();
  const ci=$('#elCfI').value,cid=$('#elCfID').value,cil=+$('#elCfIL').value,cf=$('#elCfF').checked,cfd=$('#elCfFD').value,cfl=+$('#elCfFL').value;
  if(ex&&!why){toast('Add the Board decision or reference for the exemption.');return}
  if((ci&&(!cid||cid>TODAY||!(cil>=1&&cil<=4)))||(cf&&(!cfd||cfd>TODAY||!(cfl>=1&&cfl<=4)))){toast('For a carried-forward pass, give a past sitting date and 1 to 4 sittings left.');return}
  const ch=[];if(rf!==(t.regFee!==false))ch.push('registration fee '+(rf?'paid':'not paid'));if(tf!==(t.trainFee!==false))ch.push('training fee '+(tf?'paid':'not paid'));
  const old=t.exempt?t.exempt.basis:'';if(ex!==old)ch.push(ex?'Intermediate exemption: '+ex:'Intermediate exemption removed');
  const oi=(t.cf&&t.cf.Intermediate)||null,of=(t.cf&&t.cf.Final)||null;
  if((oi?oi.subject:'')!==ci||(ci&&(oi.from!==cid||oi.left!==cil)))ch.push(ci?'Intermediate '+ci+' carried forward, '+plural(cil,'sitting')+' left':'Intermediate carry-forward removed');

  logAct('Examination eligibility record changed',`${t.name} (${t.id}): ${ch.join('; ')}${why?'. '+why:''}`);closeDrawer();render();toast(t.name+': eligibility record saved.');
}

  const help=ex==='Intermediate'?'<b>physiology</b> and <b>pharmacology</b> are Pass or Fail. Leave a subject blank if it is carried forward. <b>minimum_met</b> (Yes or No) is needed when one subject is passed and the other failed: a pass is carried forward only if the minimum score was met in the other subject.':'<b>written</b> and <b>oral_osce</b> (the oral and OSCE result together) are Pass or Fail. Leave written blank if it is carried forward. If the written is failed, oral_osce can be left blank. A failed oral_osce with the written passed carries the written pass forward.';
  return `<div class="card pad"><div class="steps"><span class="${o?'done':'on'}">1 Paste the file</span><span class="${o?'on':''}">2 Check it</span><span>3 Record results</span></div>
  <div class="fld"><label for="exRaw">CSV from the examiners for the ${ex} examination, with a header row</label><textarea id="exRaw" rows="8" class="mono" style="font-size:12.5px" placeholder="${EX_HEAD[ex]}">${esc(ui.exRaw==null?'':ui.exRaw)}</textarea></div>
  <p class="meta" style="margin:0 0 6px">Results are per ${ex==='Intermediate'?'subject':'section'}. ${help}</p><p class="meta" style="margin:0 0 12px">A carried-forward pass lasts for up to four subsequent consecutive exams. ${CF_NOTE}</p>
  <div class="btn-row"><button class="btn sec" data-a="loadEx">Load a sample file</button><button class="btn pri" data-a="checkEx">Check the file</button></div></div>${o?exOut(o):''}`;
}
const okv=x=>x===''||x==='Pass'||x==='Fail';
const cfLeftTxt=n=>n<=0?'ends with this sitting':plural(n,'sitting')+' left after this one';
function evalInt(t,c){
  const cur=t.cf&&t.cf.Intermediate;
  if(!okv(c.a)||!okv(c.b))return {err:'Each subject must be Pass, Fail or blank'};
  if(c.m&&!['Yes','No'].includes(c.m))return {err:'minimum_met must be Yes or No'};
  if(cur&&(cur.subject==='Physiology'?c.a:c.b)!=='')return {err:cur.subject+' is carried forward for this trainee. Leave it blank'};
  const ph=c.a||(cur&&cur.subject==='Physiology'?'Pass':''),pm=c.b||(cur&&cur.subject==='Pharmacology'?'Pass':'');
  if(!ph||!pm)return {err:'Both subjects need a result unless one is carried forward'};
  if(ph==='Pass'&&pm==='Pass')return {res:'Pass',cf:'clear',msg:cur?'Passes the remaining subject: Intermediate passed':'Passes both subjects: Intermediate passed'};
  if(cur)return {res:'Fail',cf:'keep',msg:cur.subject+' stays carried forward ('+cfLeftTxt(cur.left-1)+')'};
  if(ph!==pm){
    if(!c.m)return {err:'Say whether the minimum score was met in the failed subject (minimum_met)'};
    const sub=ph==='Pass'?'Physiology':'Pharmacology';
    return c.m==='Yes'?{res:'Fail',cf:{subject:sub},msg:sub+' passed and the minimum was met in the other: carried forward for 4 sittings'}:{res:'Fail',cf:'none',msg:sub+' passed but the minimum was not met in the other: not carried forward, both subjects to rewrite'};
  }
  return {res:'Fail',cf:'none',msg:'Fail: both subjects to rewrite'};
}
function evalFin(t,c){
  const cur=t.cf&&t.cf.Final;
  if(!okv(c.w)||!okv(c.o)||!okv(c.s))return {err:'Each section must be Pass, Fail or blank'};
  if(cur&&c.w!=='')return {err:'The written section is carried forward for this trainee. Leave it blank'};
  const w=c.w||(cur?'Pass':'');
  if(!w)return {err:'Written result missing'};
  if(w==='Fail')return {res:'Fail',cf:'none',msg:'Written failed: all sections to be re-sat'};
  if(!c.o||!c.s)return {err:'The oral and OSCE result (oral_osce) is needed once the written is passed'};
  if(c.o==='Pass'&&c.s==='Pass')return {res:'Pass',cf:'clear',msg:cur?'Passes oral and OSCE with the written carried forward: Final passed':'Passes all sections: Final passed'};
  if(cur)return {res:'Fail',cf:'keep',msg:'Written stays carried forward ('+cfLeftTxt(cur.left-1)+')'};
  return {res:'Fail',cf:{written:true},msg:'Written passed, oral or OSCE failed: written carried forward for 4 sittings'};
}
function checkEx(){
  const ex0=exName(),raw=$('#exRaw').value;ui.exRaw=raw;const lines=raw.split(/\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length){toast('Paste the results file first.');return}
  const h=lines[0].toLowerCase().replace(/\s/g,'');
  if(h!==EX_HEAD[ex0].toLowerCase()){ui.exOut={fatal:'The header row must be exactly: '+EX_HEAD[ex0]};render();return}
  const seen={};const rows=lines.slice(1).map((l,n)=>{
    const p=l.split(',').map(s=>(s||'').trim()),[id,ex,date]=p,t=T(id);
    const c=ex0==='Intermediate'?{a:p[3]||'',b:p[4]||'',m:p[5]||''}:{w:p[3]||'',o:p[4]||'',s:p[4]||''};
    const res=ex0==='Intermediate'?'Physiology: '+(c.a||'not sat')+' · Pharmacology: '+(c.b||'not sat'):'Written: '+(c.w||'not sat')+' · Oral and OSCE: '+(c.o||'-');
    const base={n:n+2,id,ex,date,res,name:t?t.name:''};
    if(!t)return Object.assign(base,{k:'err',msg:'Not a known HKCA number'});
    if(!['Intermediate','Final'].includes(ex))return Object.assign(base,{k:'err',msg:'Examination must be Intermediate or Final'});
    if(ex!==ex0)return Object.assign(base,{k:'err',msg:'This is the '+ex0+' tab. Upload '+ex+' results under the '+ex+' tab'});
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>TODAY)return Object.assign(base,{k:'err',msg:'Sitting date must be a past date as YYYY-MM-DD'});
    const key=id+ex;if(seen[key])return Object.assign(base,{k:'err',msg:'Duplicate of row '+seen[key]});seen[key]=n+2;
    if(t.exam[ex]==='Pass')return Object.assign(base,{k:'err',msg:'A pass is already recorded for this exam'});
    const o=ex==='Intermediate'?evalInt(t,c):evalFin(t,c);
    if(o.err)return Object.assign(base,{k:'err',msg:o.err});
    if((ex==='Final'&&t.stage==='BAT')||(ex==='Intermediate'&&t.stage==='PFY'))return Object.assign(base,{k:'warn',on:false,out:o,msg:t.stage+' does not normally sit the '+ex+'. Tick to include'});
    return Object.assign(base,{k:'ok',out:o,msg:o.msg});
  });
  ui.exOut={rows};render();
}
function exOut(o){
  if(o.fatal)return `<div class="note bad" style="margin-top:18px">${esc(o.fatal)}</div>`;
  const ok=o.rows.filter(x=>x.k==='ok').length,w=o.rows.filter(x=>x.k==='warn').length,e=o.rows.filter(x=>x.k==='err').length;const n=ok+o.rows.filter(x=>x.k==='warn'&&x.on).length;
  return `<div class="card" style="margin-top:18px"><div class="q-h"><div><div class="h3">Check result</div><div class="meta">${ok} ready &middot; ${w} need your decision &middot; ${e} with errors, which will be skipped</div></div><button class="btn pri sm" data-a="commitEx" ${n?'':'disabled'}>Record ${n||''} results</button></div><div class="tbl-scroll"><table><thead><tr><th>Row</th><th></th><th>Candidate</th><th>Exam</th><th>Per ${exName()==='Intermediate'?'subject':'section'}</th><th>Check</th></tr></thead><tbody>${o.rows.map((x,i)=>`<tr><td class="meta mono">${x.n}</td><td style="width:34px">${x.k==='warn'?`<input type="checkbox" data-c="exWarn" data-i="${i}" ${x.on?'checked':''} aria-label="Include row ${x.n}">`:''}</td><td><div class="cell-name">${esc(x.name||x.id)}</div><div class="cell-sub mono">${esc(x.id)}</div></td><td>${esc(x.ex)}</td><td class="meta">${esc(x.res)}</td><td>${dt(x.msg,{ok:'ok',warn:'warn',err:'bad'}[x.k])}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function commitEx(){
  const ex=exName(),rows=ui.exOut.rows.filter(x=>x.k==='ok'||(x.k==='warn'&&x.on));const by={},expired=[];
  [...new Set(rows.map(x=>x.date))].sort().forEach(date=>{
    // every sitting the College holds uses up one of the four sittings of any carried-forward pass (our reading; confirm with the College)
    S.trainees.forEach(t=>{const cf=t.cf&&t.cf[ex];if(cf){cf.left--;if(cf.left<=0){delete t.cf[ex];expired.push(t.name)}}});
    rows.filter(x=>x.date===date).forEach(x=>{
      const t=T(x.id),o=x.out;t.cf=t.cf||{};t.exam[ex]=o.res;
      if(o.cf==='clear'||o.cf==='none')delete t.cf[ex];else if(o.cf&&o.cf!=='keep')t.cf[ex]=Object.assign({from:date,left:4},o.cf);
      S.exResults.push({id:x.id,ex,date,res:o.res,detail:x.res});
      const k=date+'|'+ex;(by[k]=by[k]||{sitting:date,exam:ex,cand:0,pass:0,fail:0,cf:0,by:'Secretariat',at:TODAY});by[k].cand++;by[k][o.res==='Pass'?'pass':'fail']++;if(o.cf&&typeof o.cf==='object')by[k].cf++;
    });
  });
  Object.values(by).forEach(h=>S.exHist.unshift(h));
  logAct('Exam results recorded',`${ex}: ${rows.length} results from the examiners' file; ${ui.exOut.rows.length-rows.length} rows skipped`);
  if(expired.length)logAct('Exam carry-forward expired',`${expired.join(', ')}: four sittings used, all sections to be re-sat`);
  const nc=Object.values(by).reduce((n,h)=>n+h.cf,0);
  ui.exOut=null;ui.exRaw=null;ui.exView='hist';render();toast(plural(rows.length,'result')+' recorded'+(nc?', '+nc+' carried forward':'')+'.')
}

function vHist(){return `<div class="card"><div class="tbl-scroll"><table><thead><tr><th>Sitting</th><th>Examination</th><th>Candidates</th><th>Pass</th><th>Fail</th><th>Carried forward</th><th>Recorded</th></tr></thead><tbody>${S.exHist.filter(h=>h.exam===exName()).map(h=>`<tr><td>${fmt(h.sitting)}${h.label?`<div class="cell-sub">${esc(h.label)}</div>`:''}</td><td>${h.exam}</td><td>${h.cand}</td><td>${h.pass}</td><td>${h.fail}</td><td>${h.cf==null?'<span class="muted">-</span>':h.cf}</td><td class="meta">${fmt(h.at)} by ${h.by}</td></tr>`).join('')}</tbody></table></div></div>`}

<script>

const PJ_STATE={dispatch:'To dispatch',review:'Under review',reviewsIn:'Reviews in',revision:'With trainee',appeal:'Appeal',approved:'Approved',rejected:'Not approved'};

const addMonths=(i,n)=>{const d=D(i),t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,1)),dim=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d.getUTCDate(),dim));return iso(t)};
const pjCase=id=>S.projects.find(x=>x.id===id);
const pjAct=p=>p.state!=='approved'&&!(p.state==='rejected'&&p.final);
const rDue=(p,r)=>r.due||p.due;
const pjOverdue=p=>p.state==='review'&&p.rev.some(r=>!r.in&&!r.team&&rDue(p,r)<TODAY);
const pjRemDate=p=>addDays(p.due,-14);
function pjEvery(){const o=[];S.projects.forEach(c=>['prot','man'].forEach(k=>{const p=c[PK[k]];if(p)o.push({c,k,p})}));return o}
const pjParts=k=>pjEvery().filter(e=>e.k===k);
const pjUnder=()=>S.projects.filter(c=>c.protocol&&c.protocol.state==='approved'&&!c.manuscript);
function pjLog(c,part,a,det,who){c.log.push({d:TODAY,part,a,det:det||'',who:who||'Secretariat'})}
const pjNeed=k=>pjParts(k).filter(e=>['dispatch','reviewsIn','appeal'].includes(e.p.state)||pjOverdue(e.p)).length;
const pjStatePill=p=>pill(PJ_STATE[p.state]+(p.state==='rejected'&&!p.final?', appeal open':''),PJ_CLS[p.state]);
function pjWhere(e){
  const p=e.p;
  if(p.paper)return dt('Accepted paper, '+fmtS(p.at),'ok');
  switch(p.state){
    case 'dispatch':return dt('Reviewers not chosen','none');
    case 'review':{const out=p.rev.filter(r=>!r.in),mine=out.filter(r=>!r.team),tm=out.length-mine.length;if(!mine.length)return dt('Formal Project Team reviewing '+plural(tm,'missing report'),'info');const nd=mine.map(r=>rDue(p,r)).sort()[0],d=days(TODAY,nd),w=mine.filter(r=>rDue(p,r)<TODAY).length||mine.length;return d<0?dt(plural(w,'review')+' '+(-d)+' days overdue'+(tm?', '+tm+' with the Team':''),'bad'):dt(plural(mine.length,'review')+' due '+fmtS(nd)+', '+d+' days left','info')}
    case 'reviewsIn':{const same=p.rev[0].rec===p.rev[1].rec;return dt(same?'Reviewers agree: '+p.rev[0].rec:'Reviewers differ','' +(same?'ok':'warn'))}
    case 'revision':return dt('Revision requested '+fmtS(p.decD)+', with the trainee','warn');
    case 'appeal':return dt('Appeal received '+fmtS(p.appeal.d),'info');
    case 'approved':return dt('Approved '+fmtS(p.at),'ok');
    default:return dt(p.final?'Rejected, final':'Rejected '+fmtS(p.decD)+', appeal open','bad');
  }
}
function vProjects(){

  }else if(p.state==='review'){

    h+=`<div class="sect">Reviewers</div>${p.rev.map((r,i)=>{
      const a=S.assessors.find(x=>x.id===r.a),due=rDue(p,r),pastDue=due<TODAY,rd=addDays(due,-14);
      const stat=r.in?`<b>${esc(r.rec)}${r.by==='Team'?' (Formal Project Team)':''}${r.late?' (late report, accepted)':''}</b>`:r.team?dt('With the Team','info'):dt(pastDue?'Overdue':'Not yet',pastDue?'bad':'none');
      const rem=r.in?'':`<div class="meta" style="margin-top:6px">Due ${fmt(due)}. ${rd<=TODAY?'Reminder sent '+fmt(rd):'Reminder goes '+fmt(rd)}, 14 days before the deadline</div>`;
      const sel=(pre,lbl)=>`<select id="${pre}${k}${i}" aria-label="${lbl}">${REC.map(x=>`<option>${x}</option>`).join('')}</select>`;
      let act='';
      if(!r.in){
        const pool=eligible(c,taken);
        const late=`<details class="fold" style="margin-top:8px"><summary>Accept a late report (exceptional circumstances)</summary><div class="in"><p class="meta" style="margin:0 0 8px">A late report is ignored unless there are exceptional circumstances. The Secretariat can override.</p><div class="btn-row">${sel('lr','Recommendation in the late report')}</div><div class="fld" style="margin:8px 0"><label for="lw${k}${i}">Reason for the override</label><input type="text" id="lw${k}${i}" placeholder="Exceptional circumstances"></div><button class="btn sec sm" data-a="pjLate" data-id="${id}" data-k="${k}" data-i="${i}">Accept late report</button></div></details>`;
        const reas=pool.length?`<details class="fold" style="margin-top:8px"><summary>Reassign to another reviewer</summary><div class="in"><p class="meta" style="margin:0 0 8px">If a reviewer does not respond, the Formal Project Team can reassign the review. The new reviewer gets two months from today, to ${fmt(addMonths(TODAY,2))}.</p><div class="fld" style="margin:0 0 8px"><label for="ra${k}${i}">New reviewer</label><select id="ra${k}${i}">${pool.map(x=>`<option value="${x.id}">${esc(x.name)}, ${x.hosp}</option>`).join('')}</select></div><div class="fld" style="margin:0 0 8px"><label for="rn${k}${i}">Reason</label><select id="rn${k}${i}"><option>No response</option><option>Unavailable</option><option>Conflict of interest</option></select></div><button class="btn sec sm" data-a="pjReassign" data-id="${id}" data-k="${k}" data-i="${i}">Reassign</button></div></details>`:'';
        if(r.team)act=`<div class="btn-row" style="margin-top:8px">${sel('tv','Recommendation of the Formal Project Team')}<button class="btn pri sm" data-a="pjTeamRev" data-id="${id}" data-k="${k}" data-i="${i}">Record Team review</button></div>${reas}${late}`;
        else if(pastDue)act=`<div class="btn-row" style="margin-top:8px"><button class="btn pri sm" data-a="pjTeam" data-id="${id}" data-k="${k}" data-i="${i}">Hand to the Formal Project Team</button></div>${reas}${late}`;
        else act=`<div class="btn-row" style="margin-top:8px">${sel('rv','Recommendation of reviewer '+(i+1))}<button class="btn sec sm" data-a="pjRecRev" data-id="${id}" data-k="${k}" data-i="${i}">Record review</button></div>${reas}`;
      }
      return `<div class="chk" style="cursor:default;display:block"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span>${esc(a.name)}<small>${a.hosp}</small></span>${stat}</div>${rem}${act}</div>`}).join('')}`;
    if(od)h+=`<p class="note warn">The two months to ${fmt(nd)} have passed. After two months the Formal Project Team handles the review of any report still missing, or reassigns it to another reviewer; a review that is already in stands. A late report is ignored unless there are exceptional circumstances.</p>`;
    else if(out.length&&out.every(r=>r.team))h+=`<p class="note">The Formal Project Team is reviewing the missing report. The reviews already in stand.</p>`;
    else h+=`<p class="note">Due ${fmt(nd)}. A reminder goes to each reviewer who has not finished on ${fmt(addDays(nd,-14))}, 14 days before.</p>`;
  }else if(p.state==='reviewsIn'){
    const same=p.rev[0].rec===p.rev[1].rec;
    h+=`<div class="sect">Reviews</div>${p.rev.map((r,i)=>`<div class="chk" style="cursor:default;justify-content:space-between"><span>Reviewer ${i+1}<small>Name hidden from the trainee</small></span><b>${esc(r.rec)}${r.by==='Team'?' (Formal Project Team)':''}${r.late?' (late report, accepted)':''}</b></div>`).join('')}<div class="sect">Decision</div>${same?'':'<p class="note warn">The reviewers differ. The Formal Project Team decides.</p>'}${decisionForm(id,k,same?p.rev[0].rec:'Revision and resubmission')}`;
  }else if(p.state==='revision'){
    h+=`<p class="note">Revision requested ${fmt(p.decD)}. The trainee revises and resubmits. Changes to an approved protocol also need resubmission.</p><p class="note">On resubmission the same reviewers get two months from that day, to ${fmt(addMonths(TODAY,2))} if recorded today.</p><button class="btn pri" data-a="pjResub" data-id="${id}" data-k="${k}">Record resubmission</button>`;
  }else if(p.state==='appeal'){
    h+=`<p class="note">Appeal received ${fmt(p.appeal.d)} with a point-by-point reply. The Formal Project Team reviews it and may seek a second opinion. A rejection after appeal is final.</p>${decisionForm(id,k,'Revision and resubmission')}`;
  }else if(p.state==='rejected'){
    h+=p.final?`<p class="note bad">Rejected. This decision is final.</p>`:`<p class="note">Rejected ${fmt(p.decD)}. The trainee may appeal once, with a point-by-point reply to the reviewers\u2019 comments.</p><div class="btn-row"><button class="btn pri" data-a="pjAppeal" data-id="${id}" data-k="${k}">Record appeal received</button><button class="btn sec" data-a="pjNoAppeal" data-id="${id}" data-k="${k}">Close without appeal</button></div>`;
  }else{
    h+=`<p class="note ok">Approved ${fmt(p.at)}.${k==='man'?' The Board of Education and the Board of Censors have been advised that the formal project requirement is met.':''}</p>`;
  }
  return h;
}
function openCase(id){
  const c=pjCase(id),t=T(c.trainee);ui.dr={type:'case',id};ui.pick=[];
  const pa=c.protocol&&c.protocol.state==='approved'?c.protocol.at:null,ma=c.manuscript&&c.manuscript.state==='approved'?c.manuscript.at:null;
  const info=`<dl class="kv"><dt>Project</dt><dd>${esc(c.title)}</dd><dt>Trainee</dt><dd>${esc(t.name)}, ${t.hosp}</dd><dt>Type</dt><dd>${esc(c.type)}</dd><dt>Route</dt><dd>${c.protocol?'Protocol, then manuscript':'Accepted paper (guideline 2.1)'}</dd><dt>SOT sign-off</dt><dd>${c.sot?'Signed':'Not yet'}</dd><dt>Protocol approved</dt><dd>${pa?fmt(pa):c.protocol?'Not yet':'Not needed'}</dd><dt>Manuscript approved</dt><dd>${ma?fmt(ma):'Not yet'}</dd></dl>`;
  const tl=c.log.map((l,i)=>({...l,i})).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.i-a.i);
  const tlh=`<div class="sect">Timeline</div><ol class="tl">${tl.map(l=>`<li><span class="d">${fmt(l.d)}</span><span><b>${esc(l.part)}: ${esc(l.a)}</b>${l.det?`<span class="tsub">${esc(l.det)}</span>`:''}<span class="tsub">${esc(l.who)}</span></span></li>`).join('')}</ol>`;
  openDrawer(c.id,c.title.length>56?c.title.slice(0,54)+'\u2026':c.title,info+partBlock(c,'prot')+partBlock(c,'man')+tlh,'');
}
function pjRefresh(id,msg){openCase(id);render();if(msg)toast(msg)}
function pjDispatch(id,k){const c=pjCase(id),p=c[PK[k]],ids=ui.pick;p.state='review';p.disp=TODAY;p.due=addMonths(TODAY,2);p.rev=ids.map(a=>({a,in:false}));pjLog(c,PN[k],'Reviewers assigned',ids.join(' and ')+'; review due '+fmt(p.due));logAct('Reviewers assigned',`${c.id} ${PN[k].toLowerCase()}: ${ids.join(' and ')}, due ${fmt(p.due)}`);ui.pjFilter='review';pjRefresh(id,'Sent to two reviewers. Due '+fmtS(p.due)+'.')}
function pjRecRev(id,k,i){const c=pjCase(id),p=c[PK[k]],r=p.rev[i],rec=$('#rv'+k+i).value;r.in=true;r.rec=rec;r.d=TODAY;pjLog(c,PN[k],'Review in','Reviewer '+(i+1)+' recommends: '+rec,'Reviewer');logAct('Project review recorded',`${c.id} ${PN[k].toLowerCase()}: reviewer ${i+1}, ${rec}`);pjAfterRev(id,k,'Review recorded.')}
function pjAfterRev(id,k,msg){const p=pjCase(id)[PK[k]];if(p.rev.every(x=>x.in))p.state='reviewsIn';pjRefresh(id,p.state==='reviewsIn'?'All reviews are in. Record the decision.':msg)}
function pjTeam(id,k,i){const c=pjCase(id),p=c[PK[k]],r=p.rev[i];r.team=true;r.tD=TODAY;pjLog(c,PN[k],'Review handed to the Formal Project Team','Reviewer '+(i+1)+': no report within two months (due '+fmt(p.due)+')');logAct('Review handed to the Formal Project Team',`${c.id} ${PN[k].toLowerCase()}: reviewer ${i+1}, due ${fmt(p.due)}`);pjRefresh(id,'Handed to the Formal Project Team. The review already in stands.')}
function pjReassign(id,k,i){const c=pjCase(id),p=c[PK[k]],r=p.rev[i],nw=$('#ra'+k+i).value,why=$('#rn'+k+i).value,old=r.a;p.prev=(p.prev||[]).concat(old);const due=addMonths(TODAY,2);p.rev[i]={a:nw,in:false,due};pjLog(c,PN[k],'Reviewer reassigned','Reviewer '+(i+1)+': '+old+' replaced by '+nw+' ('+why.toLowerCase()+'); new reviewer due '+fmt(due),'Formal Project Team');logAct('Reviewer reassigned',`${c.id} ${PN[k].toLowerCase()}: ${old} replaced by ${nw}, ${why.toLowerCase()}; due ${fmt(due)}`);pjRefresh(id,'Reassigned to '+S.assessors.find(x=>x.id===nw).name+'. Due '+fmtS(due)+'.')}
function pjTeamRev(id,k,i){const c=pjCase(id),p=c[PK[k]],r=p.rev[i],rec=$('#tv'+k+i).value;r.in=true;r.rec=rec;r.by='Team';r.d=TODAY;pjLog(c,PN[k],'Review in','Formal Project Team review (replacing reviewer '+(i+1)+'): '+rec,'Formal Project Team');logAct('Project review recorded',`${c.id} ${PN[k].toLowerCase()}: Formal Project Team, ${rec}`);pjAfterRev(id,k,'Team review recorded.')}
function pjLate(id,k,i){const c=pjCase(id),p=c[PK[k]],r=p.rev[i],rec=$('#lr'+k+i).value,why=$('#lw'+k+i).value.trim();if(why.length<5){toast('Give the exceptional circumstances for the override.');return}r.in=true;r.rec=rec;r.late=true;r.lateWhy=why;r.d=TODAY;pjLog(c,PN[k],'Late report accepted, exceptional circumstances','Reviewer '+(i+1)+' recommends: '+rec+'. Reason: '+why,'Secretariat (override)');logAct('Late project review accepted',`${c.id} ${PN[k].toLowerCase()}: reviewer ${i+1}, ${rec}. ${why}`);pjAfterRev(id,k,'Late report accepted.')}
function pjDecide(id,k){
  const c=pjCase(id),p=c[PK[k]],N=PN[k],res=$('#pjOut'+k).value,note=$('#pjNote'+k).value.trim();
  const who=p.state==='appeal'?'Formal Project Team, on appeal':'Formal Project Team';
  if(res==='Approved'){p.state='approved';p.at=TODAY}else if(res==='Rejected'){p.state='rejected';p.decD=TODAY;p.final=!!p.appeal}else{p.state='revision';p.decD=TODAY}
  p.res=res;pjLog(c,N,res==='Approved'?'Approved':res==='Rejected'?(p.final?'Rejected, final':'Rejected'):'Revision and resubmission requested',note,who);
  if(k==='man'&&res==='Approved')pjLog(c,N,'Board of Education and Board of Censors advised','The formal project requirement is met');
  logAct('Project decision recorded',`${c.id} ${N.toLowerCase()}: ${res}${note?'. '+note:''}`);
  if(res==='Approved'&&k==='prot')ui.pjFilter='approved';
  pjRefresh(id,N+': '+res.toLowerCase()+'.');
}

function pjNoAppeal(id,k){const c=pjCase(id),p=c[PK[k]];p.final=true;pjLog(c,PN[k],'Closed without appeal','The rejection stands');logAct('Project closed without appeal',`${c.id} ${PN[k].toLowerCase()}`);pjRefresh(id,'Closed without appeal.')}

  else if(c==='warnOn'){ui.sheetOut.rows[+e.dataset.i].on=e.checked;render()}
  else if(c==='exWarn'){ui.exOut.rows[+e.dataset.i].on=e.checked;render()}
  else if(c==='pick'){const v=[...document.querySelectorAll('#pickList input:checked')].map(x=>x.value);if(v.length>2){e.checked=false;toast('Pick exactly two reviewers.');return}ui.pick=v;$('#dispBtn').disabled=v.length!==2;document.querySelectorAll('#pickList input').forEach(x=>{x.disabled=v.length>=2&&!x.checked})}
  else if(c==='pjUw'){ui.pjUw=e.checked;render()}
  else if(c==='unm'){S.unmapped[+e.dataset.i].map=e.value;save();render()}
});
document.addEventListener('input',ev=>{
  const e=ev.target;if(e.dataset.i==='q'){ui.q=e.value;const p=e.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if($('#modalBg').classList.contains('on'))closeModal();else if($('#drawer').classList.contains('on'))closeDrawer()}
  const t=ev.target.closest&&ev.target.closest('.tab');if(t&&(ev.key==='ArrowRight'||ev.key==='ArrowLeft')){const tabs=[...document.querySelectorAll('.tab')];const i=tabs.indexOf(t)+(ev.key==='ArrowRight'?1:-1);const n=tabs[(i+tabs.length)%tabs.length];n.click();setTimeout(()=>document.querySelector('.tab.on').focus(),0)}
});
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
try{if(localStorage.getItem('hkca.admin.dark')==='1')document.documentElement.classList.add('dark')}catch(e){}
function procEvents(announce){
  const sh=HKC.get();const ev=(sh.events||[]).filter(x=>x.seq>(S.evSeen||0));if(!ev.length)return false;
  ev.forEach(x=>{if(x.ex){if(x.type==='exSot'){const s=S.exams.find(y=>y.id===x.sid),t=T(x.id);if(s&&t)logAct('Exam application endorsed by SOT',`${t.name}: ${s.exam} ${s.name}. Acknowledgement email to the trainee queued`)}return}const r=S.rounds.find(y=>y.id===x.round),t=T(x.id);if(!r||!t)return;logAct(x.type==='apply'?'Course application received':'Course application withdrawn',`${t.name}: ${CNAME[r.course]} ${fmt(r.date)}`)});
  S.evSeen=ev[ev.length-1].seq;const l=ev[ev.length-1],r=S.rounds.find(y=>y.id===l.round),t=T(l.id);
  if(announce&&l.ex&&l.type==='exSot'){const s=S.exams.find(y=>y.id===l.sid);if(s&&t)toast(`${t.name}'s SOT endorsed the ${s.exam} application. It is now on your list.`)}
  else if(announce&&r&&t)toast(`${t.name} ${l.type==='apply'?'applied for':'withdrew from'} ${CNAME[r.course]}${ev.length>1?' and '+(ev.length-1)+' more':''}.`);
  save();return true;
}
window.addEventListener('storage',e=>{if(e.key!==HKC.KEY)return;S.rounds=HKC.get().rounds;S.exams=HKC.get().exams;procEvents(true);render()});
procEvents(false);
(function(){const h=location.hash.slice(1).split('/');if(VIEWS[h[0]]){ui.tab=h[0];if(h[1])ui.sub[h[0]]=h[1]}})();
render();
</script>
