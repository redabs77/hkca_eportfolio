  const list=all.filter(c=>f==='All'||(f==='Eligible'?candState(c)[0]==='Eligible':f==='Not eligible'?candState(c)[0]!=='Eligible':c.exam===f));
  const ne=all.filter(c=>candState(c)[0]==='Eligible').length;
  return `<div class="toolbar"><div class="chips">${['All','Intermediate','Final','Eligible','Not eligible'].map(x=>`<button class="chip ${f===x?'on':''}" aria-pressed="${f===x}" data-a="exF" data-v="${x}">${x}</button>`).join('')}</div><span class="meta grow" style="text-align:right">${ne} eligible of ${all.length}</span><button class="btn sec sm" data-a="toast" data-m="Entry list exported for the examiners (demo)" ${ne?'':'disabled'}>Export eligible list</button></div>
  <div class="card"><div class="tbl-scroll"><table><thead><tr><th>Candidate</th><th>Examination</th><th>Why not yet</th><th>SOT endorsement</th><th>Entry</th></tr></thead><tbody>${list.map(c=>{const t=T(c.id);const st=candState(c);return `<tr><td><div class="cell-name">${esc(t.name)}</div><div class="cell-sub">${stg(t.stage)} ${t.hosp}</div></td><td>${c.exam}</td><td class="meta">${c.fail.length?c.fail.map(esc).join('<br>'):'<span class="muted">All criteria met</span>'}</td><td>${dt(c.sot?'Endorsed':'Not yet',c.sot?'ok':'none')}</td><td>${pill(st[0],st[1])}</td></tr>`}).join('')}</tbody></table></div></div>
  <p class="meta" style="margin-top:12px">The system checks eligibility. There is no manual override here. A Board exception is a separate decision.</p>`;
}
const EX_SAMPLE=`hkca_no,exam,sitting_date,result\nHKCA-2024-019,Intermediate,2026-10-17,Pass\nHKCA-2024-027,Intermediate,2026-10-17,Pass\nHKCA-2023-022,Intermediate,2026-10-17,Fail\nHKCA-2022-006,Final,2026-10-18,Pass\nHKCA-2024-023,Final,2026-10-18,Pass\nHKCA-2022-010,Final,2026-10-18,Merit\nHKCA-2022-006,Final,2026-10-18,Pass\nHKCA-2024-099,Final,2026-10-18,Pass`;
function vResults(){
  const o=ui.exOut;
  return `<div class="card pad"><div class="steps"><span class="${o?'done':'on'}">1 Paste the file</span><span class="${o?'on':''}">2 Check it</span><span>3 Record results</span></div>
  <div class="fld"><label for="exRaw">CSV from the examiners, with a header row</label><textarea id="exRaw" rows="8" class="mono" style="font-size:12.5px" placeholder="hkca_no,exam,sitting_date,result">${esc(ui.exRaw==null?'':ui.exRaw)}</textarea></div>
  <div class="btn-row"><button class="btn sec" data-a="loadEx">Load a sample file</button><button class="btn pri" data-a="checkEx">Check the file</button></div></div>${o?exOut(o):''}`;
}
function checkEx(){
  const raw=$('#exRaw').value;ui.exRaw=raw;const lines=raw.split(/\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length){toast('Paste the results file first.');return}
  if(lines[0].toLowerCase().replace(/\s/g,'')!=='hkca_no,exam,sitting_date,result'){ui.exOut={fatal:'The header row must be exactly: hkca_no,exam,sitting_date,result'};render();return}
  const seen={};const rows=lines.slice(1).map((l,n)=>{
    const [id,ex,date,res]=l.split(',').map(s=>(s||'').trim());const t=T(id);const base={n:n+2,id,ex,date,res,name:t?t.name:''};
    if(!t)return Object.assign(base,{k:'err',msg:'Not a known HKCA number'});
    if(!['Intermediate','Final'].includes(ex))return Object.assign(base,{k:'err',msg:'Examination must be Intermediate or Final'});
    if(!['Pass','Fail'].includes(res))return Object.assign(base,{k:'err',msg:'Result must be Pass or Fail, not "'+res+'"'});
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>TODAY)return Object.assign(base,{k:'err',msg:'Sitting date must be a past date as YYYY-MM-DD'});
    const key=id+ex;if(seen[key])return Object.assign(base,{k:'err',msg:'Duplicate of row '+seen[key]});seen[key]=n+2;
    if(t.exam[ex]==='Pass')return Object.assign(base,{k:'err',msg:'A pass is already recorded for this exam'});
    if((ex==='Final'&&t.stage==='BAT')||(ex==='Intermediate'&&t.stage==='PFY'))return Object.assign(base,{k:'warn',on:false,msg:t.stage+' does not normally sit the '+ex+'. Tick to include'});
    return Object.assign(base,{k:'ok',msg:res==='Pass'?'Will record a pass':'Will record a fail'});
  });
  ui.exOut={rows};render();
}
function exOut(o){
  if(o.fatal)return `<div class="note bad" style="margin-top:18px">${esc(o.fatal)}</div>`;
  const ok=o.rows.filter(x=>x.k==='ok').length,w=o.rows.filter(x=>x.k==='warn').length,e=o.rows.filter(x=>x.k==='err').length;const n=ok+o.rows.filter(x=>x.k==='warn'&&x.on).length;
  return `<div class="card" style="margin-top:18px"><div class="q-h"><div><div class="h3">Check result</div><div class="meta">${ok} ready &middot; ${w} need your decision &middot; ${e} with errors, which will be skipped</div></div><button class="btn pri sm" data-a="commitEx" ${n?'':'disabled'}>Record ${n||''} results</button></div><div class="tbl-scroll"><table><thead><tr><th>Row</th><th></th><th>Candidate</th><th>Exam</th><th>Result</th><th>Check</th></tr></thead><tbody>${o.rows.map((x,i)=>`<tr><td class="meta mono">${x.n}</td><td style="width:34px">${x.k==='warn'?`<input type="checkbox" data-c="exWarn" data-i="${i}" ${x.on?'checked':''} aria-label="Include row ${x.n}">`:''}</td><td><div class="cell-name">${esc(x.name||x.id)}</div><div class="cell-sub mono">${esc(x.id)}</div></td><td>${esc(x.ex)}</td><td>${esc(x.res)}</td><td>${dt(x.msg,{ok:'ok',warn:'warn',err:'bad'}[x.k])}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function commitEx(){
  const rows=ui.exOut.rows.filter(x=>x.k==='ok'||(x.k==='warn'&&x.on));const by={};
  rows.forEach(x=>{T(x.id).exam[x.ex]=x.res;S.exResults.push({id:x.id,ex:x.ex,date:x.date,res:x.res});const k=x.date+'|'+x.ex;(by[k]=by[k]||{sitting:x.date,exam:x.ex,cand:0,pass:0,fail:0,by:'Secretariat',at:TODAY});by[k].cand++;by[k][x.res==='Pass'?'pass':'fail']++});
  Object.values(by).forEach(h=>S.exHist.unshift(h));
  logAct('Exam results recorded',`${rows.length} results from the examiners' file; ${ui.exOut.rows.length-rows.length} rows skipped`);ui.exOut=null;ui.exRaw=null;ui.sub.exams='hist';render();toast(plural(rows.length,'result')+' recorded.')
}
function vHist(){return `<div class="card"><div class="tbl-scroll"><table><thead><tr><th>Sitting</th><th>Examination</th><th>Candidates</th><th>Pass</th><th>Fail</th><th>Recorded</th></tr></thead><tbody>${S.exHist.map(h=>`<tr><td>${fmt(h.sitting)}</td><td>${h.exam}</td><td>${h.cand}</td><td>${h.pass}</td><td>${h.fail}</td><td class="meta">${fmt(h.at)} by ${h.by}</td></tr>`).join('')}</tbody></table></div></div>`}
</script>
<script>
/* ============ FORMAL PROJECTS ============ */
const GR=['Satisfactory','Minor revision','Major revision','Unsatisfactory'];
const PJ={dispatch:'To dispatch',review:'Under review',reviewsIn:'Reviews in',done:'Recorded'};
function vProjects(){
  const c=counts();const f=ui.pjFilter;const n=k=>S.projects.filter(p=>p.state===k||(k==='done'&&p.state==='escalated')).length;
  const list=S.projects.filter(p=>f==='done'?(p.state==='done'||p.state==='escalated'):p.state===f);
  const chips=`<div class="chips">${Object.keys(PJ).map(k=>`<button class="chip ${f===k?'on':''}" aria-pressed="${f===k}" data-a="pjF" data-v="${k}">${PJ[k]} <span class="n">${n(k)}</span></button>`).join('')}</div>`;
  const nextCol=p=>{
    if(p.state==='dispatch')return dt('Reviewers not chosen','none');
    if(p.state==='review'){const d=days(TODAY,p.due);const waiting=p.rev.filter(r=>!r.in).length;return dt(d<0?`${plural(waiting,'review')} ${-d} days overdue`:`${plural(waiting,'review')} due ${fmtS(p.due)}, ${d} days left`,d<0?'bad':'info')}
    if(p.state==='reviewsIn'){const d=Math.abs(GR.indexOf(p.rev[0].g)-GR.indexOf(p.rev[1].g));return dt(d>=2?'Reviews differ widely':d===1?'Reviews differ':'Reviews agree',d>=2?'bad':d===1?'warn':'ok')}
    if(p.state==='escalated')return dt('With the Subcommittee Chair','info');return dt('Outcome: '+p.outcome,'ok')};
  const act=p=>({dispatch:['Choose reviewers','pri'],review:['Open','sec'],reviewsIn:['Record outcome','pri'],done:['Open','sec'],escalated:['Open','sec']}[p.state]);
  return head('Formal projects','Review pipeline','Reviewers are chosen by the Secretariat and never see the trainee\u2019s name. Each review has 30 days.',chips)+
  `<div class="card"><div class="tbl-scroll"><table><thead><tr><th>Project</th><th>Trainee</th><th>Stage</th><th>Where it stands</th><th class="act"></th></tr></thead><tbody>${list.map(p=>{const t=T(p.trainee);const a=act(p);return `<tr><td style="max-width:380px"><div class="cell-name">${esc(p.title)}</div><div class="cell-sub mono">${p.id}</div></td><td>${esc(t.name)}<div class="cell-sub">${t.hosp}</div></td><td>${p.stage}</td><td>${nextCol(p)}</td><td class="act"><button class="btn ${a[1]} sm" data-a="openProject" data-id="${p.id}">${a[0]}</button></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Nothing here.</td></tr>'}</tbody></table></div></div>`;
}
const eligible=(p,excl)=>S.assessors.filter(a=>a.hosp!==T(p.trainee).hosp&&!(excl||[]).includes(a.id));
function openProject(id){
  const p=S.projects.find(x=>x.id===id);const t=T(p.trainee);ui.dr={type:'project',id};ui.pick=[];
  const info=`<dl class="kv"><dt>Project</dt><dd>${esc(p.title)}</dd><dt>Trainee</dt><dd>${esc(t.name)}, ${t.hosp}</dd><dt>Stage</dt><dd>${p.stage}</dd><dt>SOT sign-off</dt><dd>${p.sot?'Signed':'Not yet'}</dd></dl>`;
  let body=info,foot='';
  if(p.state==='dispatch'){
    const el=eligible(p),ex=S.assessors.filter(a=>a.hosp===t.hosp);
    body+=`<div class="sect">Choose two reviewers</div><div id="pickList">${el.map(a=>`<label class="chk"><input type="checkbox" data-c="pick" value="${a.id}"><span>${esc(a.name)}<small>${a.hosp}</small></span></label>`).join('')}</div>${ex.length?`<details class="fold"><summary>${plural(ex.length,'assessor')} excluded</summary><div class="in meta">${ex.map(a=>esc(a.name)+', '+a.hosp).join('<br>')}<br>Same hospital as the trainee.</div></details>`:''}<p class="note">Both reviewers get the same 30-day deadline from today, ${fmt(addDays(TODAY,30))}.</p>`;
    foot=`<button class="btn sec" data-a="closeDrawer">Cancel</button><button class="btn pri" id="dispBtn" data-a="dispatch" data-id="${id}" disabled>Send to reviewers</button>`;
  }else if(p.state==='review'){
    const od=p.due<TODAY;
    body+=`<div class="sect">Reviewers</div>${p.rev.map((r,i)=>{const a=S.assessors.find(x=>x.id===r.a);return `<div class="chk" style="cursor:default;justify-content:space-between;align-items:center"><span>${esc(a.name)}<small>${a.hosp}</small></span><span style="display:flex;gap:10px;align-items:center">${r.in?dt('Review in','ok'):dt(od?'Overdue':'Not yet',od?'bad':'none')}${!r.in&&od?`<button class="btn sec sm" data-a="replaceRev" data-id="${id}" data-i="${i}">Replace</button>`:''}</span></div>`}).join('')}<p class="note ${od?'warn':''}">${od?'The deadline of '+fmt(p.due)+' has passed. Replacing a reviewer gives the new one 30 days.':'Due '+fmt(p.due)+'. A reminder goes to each reviewer who has not finished, 7 days before.'}</p>`;
  }else if(p.state==='reviewsIn'){
    const d=Math.abs(GR.indexOf(p.rev[0].g)-GR.indexOf(p.rev[1].g));
    body+=`<div class="sect">Reviews</div>${p.rev.map((r,i)=>`<div class="chk" style="cursor:default;justify-content:space-between"><span>Reviewer ${i+1}<small>Name hidden from the trainee</small></span><b>${r.g}</b></div>`).join('')}
    <div class="sect">Outcome</div><div class="fld"><label for="pjOut">Outcome to record</label><select id="pjOut">${GR.map(g=>`<option ${g===(d===0?p.rev[0].g:GR[Math.max(GR.indexOf(p.rev[0].g),GR.indexOf(p.rev[1].g))])?'selected':''}>${g}</option>`).join('')}</select></div>${d>=2?'<p class="note warn">The two reviews are two or more grades apart. Record an outcome only if the Board policy allows it, otherwise escalate.</p>':d===1?'<p class="note">The reviews differ by one grade. Choose the outcome, or escalate.</p>':''}`;
    foot=`<button class="btn sec" data-a="escalate" data-id="${id}">Escalate to Subcommittee Chair</button><button class="btn pri" data-a="recordPj" data-id="${id}">Record outcome</button>`;
  }else if(p.state==='escalated'){body+=`<p class="note">Sent to the Formal Project Subcommittee Chair. The outcome will be recorded here when the Chair decides.</p>`}
  else{body+=`<dl class="kv"><dt>Outcome</dt><dd>${p.outcome}</dd></dl><p class="note ok">Recorded on ${fmt(p.at)}. The trainee and SOT see the outcome in the portfolio.</p>`}
  openDrawer(p.id,p.stage+' stage',body,foot);
}
function dispatchPj(id){const p=S.projects.find(x=>x.id===id);const ids=ui.pick;p.state='review';p.due=addDays(TODAY,30);p.rev=ids.map(a=>({a,in:false}));logAct('Reviewers assigned',`${p.id}: ${ids.join(' and ')}, due ${fmt(p.due)}`);closeDrawer();ui.pjFilter='review';render();toast('Sent to two reviewers. Due '+fmtS(p.due)+'.')}
function replaceRev(id,i){const p=S.projects.find(x=>x.id===id);const cur=p.rev.map(r=>r.a);const a=eligible(p,cur)[0];if(!a){toast('No other eligible assessor.');return}const old=p.rev[i].a;p.rev[i]={a:a.id,in:false};p.due=addDays(TODAY,30);logAct('Reviewer replaced',`${p.id}: ${old} replaced by ${a.id}`);openProject(id);render();toast('Replaced with '+a.name+'. New deadline '+fmtS(p.due)+'.')}
function recordPj(id){const p=S.projects.find(x=>x.id===id);p.state='done';p.outcome=$('#pjOut').value;p.at=TODAY;logAct('Project outcome recorded',`${p.id}: ${p.outcome}`);closeDrawer();ui.pjFilter='done';render();toast('Outcome recorded: '+p.outcome+'.')}
function escalate(id){const p=S.projects.find(x=>x.id===id);p.state='escalated';logAct('Project escalated',`${p.id} sent to the Subcommittee Chair`);closeDrawer();ui.pjFilter='done';render();toast('Escalated to the Subcommittee Chair.')}

/* ============ CENTRES & SOTs ============ */
function vCentres(){
  const s=ui.sub.centres;const c=counts();
  const seg=subSeg('centres',[['accred','Accreditation',c.accSoon],['appts','SOT appointments',c.pend],['roster','Rosters',c.rosterOpen]]);
  const t={accred:'Each centre\u2019s longest permitted stay and when its accreditation expires. Expiry within a year is flagged.',appts:'Who holds the SOT and Assistant SOT roles, from the date the Board endorsed them.',roster:'Each hospital\u2019s June and December confirmation of who is in training there.'}[s];
  return head('Centres and SOTs',{accred:'Accreditation',appts:'SOT appointments',roster:'Rosters'}[s],t,seg)+(s==='accred'?vAccred():s==='appts'?vAppts():vRoster());
}
function vAccred(){
  const rows=S.centres.slice().sort((a,b)=>a.exp>b.exp?1:-1);
  return `<div class="toolbar"><span class="meta grow">${rows.length} accredited centres</span><button class="btn pri sm" data-a="addCentre">Add a centre</button></div><div class="card"><div class="tbl-scroll"><table><thead><tr><th>Centre</th><th>Cluster</th><th>Longest stay per trainee</th><th>Accreditation expires</th><th class="act"></th></tr></thead><tbody>${rows.map(c=>{const d=days(TODAY,c.exp);const m=Math.floor(d/30.4);return `<tr><td class="cell-name">${c.hosp}</td><td>${c.cluster}</td><td>${c.limit} months</td><td>${fmt(c.exp)} ${d<=366?dt('in '+m+' months','warn'):''}</td><td class="act"><button class="btn sec sm" data-a="editCentre" data-h="${c.hosp}">Edit</button></td></tr>`}).join('')}</tbody></table></div></div>`;
}
function editCentre(h){const c=S.centres.find(x=>x.hosp===h);ui.dr={type:'centre',h};openDrawer(c.cluster,c.hosp,`<div class="fld"><label for="cLim">Longest stay per trainee (months)</label><input type="number" id="cLim" min="0" max="72" value="${c.limit}"></div><div class="fld"><label for="cExp">Accreditation expires</label><input type="date" id="cExp" value="${c.exp}"></div><p class="note">Changes apply from today. Trainees already allocated stay allocated. The reason is recorded.</p><div class="fld"><label for="cWhy">Reason</label><textarea id="cWhy" rows="2"></textarea></div>`,`<button class="btn sec" data-a="closeDrawer">Cancel</button><button class="btn pri" data-a="saveCentre" data-h="${h}">Save</button>`)}
function saveCentre(h){const c=S.centres.find(x=>x.hosp===h);const l=+$('#cLim').value,e=$('#cExp').value,w=$('#cWhy').value.trim();if(!e||l<0){toast('Enter a limit and an expiry date.');return}if(!w){toast('Add a reason for the record.');return}logAct('Accreditation changed',`${h}: longest stay ${c.limit} to ${l} months, expiry ${fmt(c.exp)} to ${fmt(e)}. ${w}`);c.limit=l;c.exp=e;closeDrawer();render();toast(h+' updated.')}
function addCentre(){const free=HOSP.filter(([c,h])=>!S.centres.find(x=>x.hosp===h));openModal(`<h3>Add an accredited centre</h3><div class="fld" style="margin-top:12px"><label for="nHosp">Hospital</label><select id="nHosp">${free.map(([c,h])=>`<option>${h}</option>`).join('')}</select></div><div class="fld"><label for="nLim">Longest stay per trainee (months)</label><input type="number" id="nLim" value="24" min="0" max="72"></div><div class="fld"><label for="nExp">Accreditation expires</label><input type="date" id="nExp"></div><div class="btn-row"><button class="btn sec" data-a="closeModal">Cancel</button><button class="btn pri" data-a="doAddCentre">Add centre</button></div>`)}
function doAddCentre(){const h=$('#nHosp').value,l=+$('#nLim').value,e=$('#nExp').value;if(!e||e<=TODAY){toast('Enter an expiry date in the future.');return}S.centres.push({hosp:h,cluster:CLUSTER[h],limit:l,exp:e});logAct('Centre added',`${h}: ${l} months, expires ${fmt(e)}`);closeModal();render();toast(h+' added.')}

function vAppts(){
  const cur=S.appts.filter(a=>!a.ended).sort((a,b)=>a.hosp>b.hosp?1:a.hosp<b.hosp?-1:a.role>b.role?1:-1);
  const pend=S.pendingAppt.map(p=>`<div class="q-item" style="padding-left:0"><div class="q-bar" style="background:var(--t2f)"></div><div><div class="q-title">${esc(p.nominee)} as ${p.role} at ${p.hosp}</div><div class="q-why">Endorsed by the Board on ${fmt(p.boe)}. Replaces the current term, which ends ${fmt(S.appts.find(a=>a.hosp===p.hosp&&a.role===p.role&&a.until).until)}. Effective ${fmt(p.eff)}.</div></div><button class="btn pri sm" data-a="enterAppt" data-id="${p.id}">Enter appointment</button></div>`).join('');
  return `${pend?`<div class="card" style="margin-bottom:18px"><div class="q-h"><div class="h3">Waiting to be entered <span class="cnt hot">${S.pendingAppt.length}</span></div></div>${pend}</div>`:''}
  <div class="toolbar"><span class="meta grow">${cur.length} current role holders</span><button class="btn sec sm" data-a="newAppt">Appoint someone else</button></div>
  <div class="card"><div class="tbl-scroll"><table><thead><tr><th>Hospital</th><th>Role</th><th>Name</th><th>From</th><th>Until</th><th class="act"></th></tr></thead><tbody>${cur.map(a=>`<tr><td class="cell-name">${a.hosp}</td><td>${a.role}</td><td>${esc(a.who)}</td><td>${fmt(a.from)}</td><td>${a.until?fmt(a.until):'<span class="muted">Open-ended</span>'}</td><td class="act"><button class="btn sec sm" data-a="endAppt" data-id="${a.id}">${a.until?'Change end date':'End term'}</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
function apptForm(h,r,who,eff,boe,idp){return `<div class="fld"><label for="aH">Hospital</label><select id="aH">${hospOpts(h)}</select></div><div class="fld"><label for="aR">Role</label><select id="aR">${['SOT','Assistant SOT'].map(x=>`<option ${x===r?'selected':''}>${x}</option>`).join('')}</select></div><div class="fld"><label for="aW">Name</label><input type="text" id="aW" value="${esc(who)}" placeholder="Full name"></div><div class="fld"><label for="aE">Effective from</label><input type="date" id="aE" value="${eff}"></div><div class="fld"><label for="aB">Date the Board endorsed it</label><input type="date" id="aB" max="${TODAY}" value="${boe}"></div>`}
function enterAppt(id){const p=S.pendingAppt.find(x=>x.id===id);ui.pa=id;openModal(`<h3>Enter the appointment</h3><p class="meta" style="margin-bottom:12px">Check the details against the Board minute.</p>${apptForm(p.hosp,p.role,p.nominee,p.eff,p.boe)}<div class="btn-row"><button class="btn sec" data-a="closeModal">Cancel</button><button class="btn pri" data-a="doAppt">Enter appointment</button></div>`)}
function newAppt(){ui.pa=null;openModal(`<h3>Appoint someone</h3><p class="meta" style="margin-bottom:12px">An appointment needs a Board endorsement date.</p>${apptForm('PWH','Assistant SOT','',TODAY,'')}<div class="btn-row"><button class="btn sec" data-a="closeModal">Cancel</button><button class="btn pri" data-a="doAppt">Enter appointment</button></div>`)}
function doAppt(){
  const h=$('#aH').value,r=$('#aR').value,w=$('#aW').value.trim(),e=$('#aE').value,b=$('#aB').value;
  if(!w){toast('Enter the name.');return}if(!b||b>TODAY){toast('Enter the Board endorsement date. It cannot be in the future.');return}if(!e){toast('Enter the effective date.');return}
  const cur=S.appts.find(a=>a.hosp===h&&a.role===r&&!a.ended);
  if(cur&&!cur.until){toast(`${h} already has a ${r} with no end date. End that term first.`);return}
  S.appts.push({id:'AP'+Date.now(),hosp:h,role:r,who:w,from:e,until:null});
  if(ui.pa){S.pendingAppt=S.pendingAppt.filter(x=>x.id!==ui.pa);ui.pa=null}
  logAct('Appointment entered',`${w}, ${r}, ${h}, from ${fmt(e)}. Board endorsement ${fmt(b)}`);closeModal();render();toast(`${w} entered as ${r} at ${h}.`)
}
function endAppt(id){const a=S.appts.find(x=>x.id===id);ui.ea=id;openModal(`<h3>${a.until?'Change':'End'} the term of ${esc(a.who)}</h3><p class="meta" style="margin:6px 0 12px">${a.role}, ${a.hosp}</p><div class="fld"><label for="eD">Last day in role</label><input type="date" id="eD" value="${a.until||TODAY}" min="${a.from}"></div><div class="fld"><label for="eW">Reason</label><input type="text" id="eW" placeholder="For the record"></div><div class="btn-row"><button class="btn sec" data-a="closeModal">Cancel</button><button class="btn pri" data-a="doEnd">Save</button></div>`)}
function doEnd(){const a=S.appts.find(x=>x.id===ui.ea);const d=$('#eD').value,w=$('#eW').value.trim();if(!d||!w){toast('Enter a date and a reason.');return}a.until=d;if(d<=TODAY)a.ended=true;logAct('Term ended',`${a.who}, ${a.role}, ${a.hosp}: last day ${fmt(d)}. ${w}`);closeModal();render();toast('Term updated.')}
function vRoster(){
  return `<div class="card"><div class="q-h"><div class="h3">June 2026 round</div><span class="meta">Next round opens 1 December. SOTs of the ${S.centres.length} centres confirm their lists.</span></div><div class="tbl-scroll"><table><thead><tr><th>Hospital</th><th>Confirmed by SOT</th><th>Changes reported</th><th class="act"></th></tr></thead><tbody>${S.roster.map(r=>`<tr><td class="cell-name">${r.hosp}</td><td>${dt('Confirmed '+fmtS(r.on),'ok')}</td><td>${r.changes?`${r.changes} ${r.changes===1?'change':'changes'} ${r.reviewed?dt('Reviewed','ok'):''}`:'<span class="muted">None</span>'}</td><td class="act">${r.changes&&!r.reviewed?`<button class="btn sec sm" data-a="rosterRev" data-h="${r.hosp}">Mark reviewed</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function rosterRev(h){const r=S.roster.find(x=>x.hosp===h);r.reviewed=true;logAct('Roster changes reviewed',`${h}: ${r.changes} reported changes`);render();toast(h+' changes marked as reviewed.')}

/* ============ iWBA SYNC ============ */
const CODES=['CF-2.1','CF-2.2','CF-2.3','CF-2.4','CF-2.5','CF-2.6','CF-2.7','SM-3.1','SM-3.2','SM-3.3','SM-3.4','SM-3.5','SM-3.6','SM-3.7','SM-3.8','SM-3.9','SM-3.10','SM-3.11'];
function vWba(){
  const c=counts();const s=ui.sub.wba;
  const seg=subSeg('wba',[['link','People to link',c.link],['unmapped','Items to map',c.unm],['held','Held back',S.quarantine.length?0:0]]);
  const strip=`<div class="card pad" style="margin-bottom:18px;display:flex;gap:18px 30px;flex-wrap:wrap;align-items:center;justify-content:space-between"><div style="display:flex;gap:10px 34px;flex-wrap:wrap"><div><div class="eyebrow">Last read</div><div style="font-weight:650">${S.sync.last==='now'?'Just now':S.sync.last.slice(11)+' today'}</div></div><div><div class="eyebrow">Records read</div><div style="font-weight:650">${S.sync.read}</div></div><div><div class="eyebrow">Failed</div><div style="font-weight:650">${S.sync.fail}</div></div><div><div class="eyebrow">History backfill</div><div style="font-weight:650">${S.sync.backfill} <span class="meta">(waiting on JCIMED)</span></div></div></div><button class="btn sec sm" data-a="readNow">Read now</button></div>`;
  const body=s==='link'?vLink():s==='unmapped'?vUnm():vHeld();
  const jc=`<details class="fold"><summary><span>Waiting on JCIMED <span class="meta" style="font-weight:500">&middot; ${S.jcimed.length} questions</span></span></summary><div class="in"><table><tbody>${S.jcimed.map(q=>`<tr><td>${esc(q[0])}</td><td class="meta" style="text-align:right">${q[1]}</td></tr>`).join('')}</tbody></table><p class="meta" style="margin-top:8px">The linking and mapping screens work whatever the answers are. The answers change how much is automatic.</p></div></details>`;
  return head('iWBA sync',{link:'People to link',unmapped:'Items to map',held:'Held back'}[s],'Assessments come in from iWBA on their own. These are the things only a person can settle.',seg)+strip+body+jc;
}
function vLink(){
  if(!S.people.length)return `<div class="card"><div class="empty">Everyone iWBA has sent is linked to a portfolio.</div></div>`;
  return `<div class="toolbar"><span class="meta grow">${plural(S.people.length,'person','people')} in iWBA with no portfolio link</span><button class="btn sec sm" data-a="bulkLink">Link from a file</button></div><div class="card"><div class="tbl-scroll"><table><thead><tr><th>Name in iWBA</th><th>Role</th><th>Assessments held</th><th>Best match</th><th class="act"></th></tr></thead><tbody>${S.people.map(p=>{const m=p.sug&&(T(p.sug.id)||S.assessors.find(a=>a.id===p.sug.id));return `<tr><td><div class="cell-name">${esc(p.iw)}</div><div class="cell-sub">${p.hosp} <span class="mono">${p.id}</span></div></td><td>${p.role}</td><td>${p.n}</td><td>${m?`<div>${esc(m.name)}</div><div class="cell-sub">${esc(p.sug.why)}</div>`:'<span class="muted">No match found</span>'}</td><td class="act">${m?`<button class="btn pri sm" data-a="linkIt" data-id="${p.id}" data-to="${p.sug.id}">Confirm link</button> `:''}<button class="btn sec sm" data-a="linkOther" data-id="${p.id}">${m?'Someone else':'Choose person'}</button></td></tr>`}).join('')}</tbody></table></div></div>`;
}
function linkIt(id,to){const p=S.people.find(x=>x.id===id);const m=T(to)||S.assessors.find(a=>a.id===to);S.people=S.people.filter(x=>x.id!==id);logAct('iWBA user linked',`${p.id} (${p.iw}) linked to ${m.name} (${to}); ${p.n} assessments attached`);closeModal();render();toast(`${p.n} assessments now appear for ${m.name}.`)}
function linkOther(id){const p=S.people.find(x=>x.id===id);const opts=p.role==='Trainer'?S.assessors.map(a=>`<option value="${a.id}">${esc(a.name)}, ${a.hosp}</option>`):S.trainees.filter(t=>t.status!=='Deactivated').map(t=>`<option value="${t.id}">${esc(t.name)}, ${t.hosp}</option>`);openModal(`<h3>Link ${esc(p.iw)}</h3><p class="meta" style="margin:6px 0 12px">${p.role} at ${p.hosp} in iWBA, ${p.n} assessments held.</p><div class="fld"><label for="lkSel">Portfolio record</label><select id="lkSel">${opts.join('')}</select></div><div class="btn-row"><button class="btn sec" data-a="closeModal">Cancel</button><button class="btn pri" data-a="linkSel" data-id="${id}">Link</button></div>`)}
function bulkLink(){openModal(`<h3>Link from a file</h3><p class="meta" style="margin:6px 0 12px">Two columns, no header: the iWBA user ID and the HKCA number or assessor ID.</p><textarea id="bkRaw" rows="5" class="mono" style="font-size:12.5px">U-8841,HKCA-2024-019\nU-9999,HKCA-2024-011\nU-8833,HKCA-2023-015</textarea><div class="btn-row"><button class="btn sec" data-a="closeModal">Cancel</button><button class="btn pri" data-a="doBulk">Link what matches</button></div>`)}
function doBulk(){
  const lines=$('#bkRaw').value.split(/\n/).map(s=>s.trim()).filter(Boolean);let ok=0,bad=[];
  lines.forEach(l=>{const [u,h]=l.split(',').map(s=>s.trim());const p=S.people.find(x=>x.id===u);const m=T(h)||S.assessors.find(a=>a.id===h);if(p&&m){S.people=S.people.filter(x=>x.id!==u);ok++;logAct('iWBA user linked',`${u} linked to ${m.name} (${h}) from file`)}else bad.push(u+(p?' (no such record)':' (not in the queue)'))});
  closeModal();render();toast(`${ok} linked.${bad.length?' Not linked: '+bad.join(', ')+'.':''}`)
}
function vUnm(){
  if(!S.unmapped.length)return `<div class="card"><div class="empty">Every item iWBA has used is mapped to a curriculum code.</div></div>`;
  return `<div class="note">Until JCIMED confirms how curriculum codes come back, items are matched by their iWBA code. Assessments wait here, and the trainee sees them as soon as you save the mapping.</div><div class="card"><div class="tbl-scroll"><table><thead><tr><th>iWBA item</th><th>Assessments waiting</th><th>Curriculum code</th><th class="act"></th></tr></thead><tbody>${S.unmapped.map((u,i)=>`<tr><td><div class="cell-name">${esc(u.name)}</div><div class="cell-sub mono">${u.code}</div></td><td>${u.n}</td><td><select data-c="unm" data-i="${i}" aria-label="Curriculum code for ${esc(u.code)}"><option value="">Choose a code</option>${CODES.map(c=>`<option ${u.map===c?'selected':''}>${c}</option>`).join('')}</select></td><td class="act"><button class="btn pri sm" data-a="saveUnm" data-i="${i}" ${u.map?'':'disabled'}>Save mapping</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
function saveUnm(i){const u=S.unmapped[i];S.unmapped.splice(i,1);logAct('iWBA item mapped',`${u.code} (${u.name}) mapped to ${u.map}; ${u.n} assessments released`);render();toast(`${u.code} mapped to ${u.map}. ${u.n} assessments released.`)}
function vHeld(){
  return `<div class="note">These came from iWBA but are not part of the HKCA curriculum, so they are kept out of every portfolio. Nothing is deleted.</div><div class="card"><div class="tbl-scroll"><table><thead><tr><th>iWBA item</th><th>Assessments</th><th>Why held back</th></tr></thead><tbody>${S.quarantine.map(q=>`<tr><td><div class="cell-name">${esc(q.name)}</div><div class="cell-sub mono">${q.code}</div></td><td>${q.n}</td><td class="meta">${esc(q.why)}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function readNow(){S.sync.last='now';S.sync.read+=Math.floor(Math.random()*6)+2;logAct('iWBA read triggered','Manual read from the console');render();toast('Read from iWBA. No new people or items.')}

/* ============ LOG, ROUTER, EVENTS ============ */
function openLog(){
  openDrawer('Audit trail','Activity log',(S.log.length?S.log.map(l=>`<div class="log-row"><div class="t">${fmtS(l.d)} ${l.t}</div><div><b>${esc(l.a)}</b><div class="meta">${esc(l.det)}</div></div><div class="h">${l.h}</div></div>`).join(''):'<p class="meta">Nothing yet. Each action you take in this console is recorded here with a chained reference.</p>')+'<p class="note" style="margin-top:14px">Each line carries a reference that depends on the line before it, so a changed or removed entry shows. This is the same trail the College can inspect.</p>','');
}
const TABS=[['home','Home'],['trainees','Trainees'],['courses','Courses'],['exams','Exams'],['projects','Formal projects'],['centres','Centres and SOTs'],['wba','iWBA sync']];
function tabBadge(k){const c=counts();return {trainees:c.intake+c.recogAct,courses:c.triage,projects:c.pjDispatch+c.pjOver+c.pjIn,centres:c.pend+c.accSoon,wba:c.link+c.unm}[k]||0}
const VIEWS={home:vHome,trainees:vTrainees,courses:vCourses,exams:vExams,projects:vProjects,centres:vCentres,wba:vWba};
function render(){
  const y=window.scrollY;
  $('#tabs').innerHTML=ui.role==='to'?toTab():TABS.map(([k,l])=>{const b=tabBadge(k);return `<button class="tab ${ui.tab===k?'on':''}" role="tab" aria-selected="${ui.tab===k}" data-a="go" data-t="${k}" tabindex="${ui.tab===k?0:-1}">${l}${b?` <span class="cnt hot">${b}</span>`:''}</button>`}).join('');
  $('#app').innerHTML=(ui.role==='to'?vTO:VIEWS[ui.tab])();roleChrome();save();
  history.replaceState(null,'','#'+ui.tab+(ui.tab!=='home'&&ui.sub[ui.tab]?'/'+ui.sub[ui.tab]:''));
  document.title='HKCA e-Portfolio · '+TABS.find(t=>t[0]===ui.tab)[1]+' (Secretariat prototype)';
  window.scrollTo(0,y);
}
function go(t,k){ui.tab=t;if(k)ui.sub[t]=k;closeDrawer();window.scrollTo(0,0);render()}
const ACT={
  go:e=>go(e.dataset.t,e.dataset.k),sub:e=>{ui.sub[e.dataset.t]=e.dataset.k;render()},
  theme:()=>{document.documentElement.classList.toggle('dark');try{localStorage.setItem('hkca.admin.dark',document.documentElement.classList.contains('dark')?1:0)}catch(x){}},
  closeDrawer,closeModal,openLog,toast:e=>toast(e.dataset.m),demoPop:()=>$('#demoPop').classList.toggle('on'),
  resetDemo:()=>{HKC.reset();S=seedState();S.rounds=HKC.get().rounds;ui.q='';ui.docketSel={};ui.role='admin';ui.dkGate='All';ui.dkStat='All';ui.exOut=null;ui.sheetOut=null;$('#demoPop').classList.remove('on');closeDrawer();render();toast('Demo data reset.')},
  sort:e=>{const k=e.dataset.k;ui.sort=[k,ui.sort[0]===k?-ui.sort[1]:1];render()},
  fStage:e=>{ui.stage=e.dataset.v;render()},openTrainee:e=>openTrainee(e.dataset.id),saveStatus:e=>saveStatus(e.dataset.id),
  openIntake:e=>openIntake(e.dataset.id),approveIntake:e=>approveIntake(e.dataset.id),returnIntake:e=>returnIntake(e.dataset.id),doReturn:e=>doReturn(e.dataset.id),
  dkAll:e=>{dkVisible().filter(x=>x.c.ready&&(!e.dataset.g||x.t.stage===e.dataset.g)).forEach(x=>ui.docketSel[x.t.id]=true);render()},dkGo,dkDo,fDkGate:e=>{ui.dkGate=e.dataset.v;render()},fDkStat:e=>{ui.dkStat=e.dataset.v;render()},
  sigRemind:e=>sigRemind(e.dataset.id,e.dataset.w),sigPdf:e=>sigPdf(e.dataset.id,e.dataset.w),simSign,
  openRecog:e=>openRecog(e.dataset.id),sendTO:e=>sendTO(e.dataset.id),returnRecog:e=>returnRecog(e.dataset.id),doRecogReturn:e=>doRecogReturn(e.dataset.id),openToForm:e=>openToForm(e.dataset.id,e.dataset.b==='1'),toSubmit:e=>toSubmit(e.dataset.id,e.dataset.b==='1'),openToView:e=>openToView(e.dataset.id),simSubmit,unlockRecog:e=>unlockRecog(e.dataset.id),reviewCredit:e=>reviewCredit(e.dataset.id),execCredit,
  pickRound:e=>{ui.round=e.dataset.id;render()},rdF:e=>{ui.rdF=e.dataset.v;render()},newRound,editRound:e=>editRound(e.dataset.id),saveRound:e=>saveRound(e.dataset.id),openNow:e=>openNow(e.dataset.id),closeNow:e=>closeNow(e.dataset.id),reopen:e=>reopen(e.dataset.id),doReopen:e=>doReopen(e.dataset.id),decideRound:e=>decideRound(e.dataset.id),attendRound:e=>attendRound(e.dataset.id),suggestSeats,applySuggest,loadSheet:()=>{ui.sheet=SHEET;ui.sheetOut=null;render()},checkSheet,commitSheet,
  exF:e=>{ui.exFilter=e.dataset.v;render()},loadEx:()=>{ui.exRaw=EX_SAMPLE;ui.exOut=null;render()},checkEx,commitEx,
  pjF:e=>{ui.pjFilter=e.dataset.v;render()},openProject:e=>openProject(e.dataset.id),dispatch:e=>dispatchPj(e.dataset.id),replaceRev:e=>replaceRev(e.dataset.id,+e.dataset.i),recordPj:e=>recordPj(e.dataset.id),escalate:e=>escalate(e.dataset.id),
  addCentre,doAddCentre,editCentre:e=>editCentre(e.dataset.h),saveCentre:e=>saveCentre(e.dataset.h),enterAppt:e=>enterAppt(e.dataset.id),newAppt,doAppt,endAppt:e=>endAppt(e.dataset.id),doEnd,rosterRev:e=>rosterRev(e.dataset.h),
  linkIt:e=>linkIt(e.dataset.id,e.dataset.to),linkOther:e=>linkOther(e.dataset.id),linkSel:e=>linkIt(e.dataset.id,$('#lkSel').value),bulkLink,doBulk,saveUnm:e=>saveUnm(+e.dataset.i),readNow
};
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-a]');if(!e)return;const f=ACT[e.dataset.a];if(f){ev.preventDefault();f(e)}});
document.addEventListener('change',ev=>{
  const e=ev.target,c=e.dataset.c;if(!c)return;
  if(c==='status'){ui.status=e.value;render()}
  else if(c==='hosp'){ui.hosp=e.value;render()}
  else if(c==='intakeChk'){const a=S.intake.find(x=>x.id===e.dataset.id);a.chk[e.dataset.k]=e.checked;save();refreshIntake(a)}
  else if(c==='recRc'){const r=S.recog.find(x=>x.id===e.dataset.id);r.rc[+e.dataset.i]=e.checked;save();refreshRecog(r)}
  else if(c==='toOut'){toOutChange(e.value)}
  else if(c==='role'){ui.role=e.value;closeDrawer();$('#demoPop').classList.remove('on');window.scrollTo(0,0);render()}
  else if(c==='dkSel'){ui.docketSel[e.dataset.id]=e.checked;render()}
  else if(c==='setApp'){const r=S.rounds.find(x=>x.id===ui.round);const a=r.apps[+e.dataset.i];a[2]=e.value;if(e.value!=='Requested'){const t=T(a[0]);logAct('Course decision',`${t?t.name:a[0]}: ${e.value} for ${CNAME[r.course]} ${fmt(r.date)}${e.value==='Accepted'?'. Notice of acceptance queued by email':''}`)}save();render()}
  else if(c==='rfCourse'){if(isMand(e.value))['rfFeeM','rfFeeN'].forEach(i=>{if($('#'+i).value==='')$('#'+i).value=0})}
  else if(c==='rdS'){ui.rdS=e.value;render()}
  else if(c==='cn'){ui.cn=e.value;ui.sheetOut=null;render()}
  else if(c==='warnOn'){ui.sheetOut.rows[+e.dataset.i].on=e.checked;render()}
  else if(c==='exWarn'){ui.exOut.rows[+e.dataset.i].on=e.checked;render()}
  else if(c==='pick'){const v=[...document.querySelectorAll('#pickList input:checked')].map(x=>x.value);if(v.length>2){e.checked=false;toast('Pick exactly two reviewers.');return}ui.pick=v;$('#dispBtn').disabled=v.length!==2;document.querySelectorAll('#pickList input').forEach(x=>{x.disabled=v.length>=2&&!x.checked})}
  else if(c==='unm'){S.unmapped[+e.dataset.i].map=e.value;save();render()}
});
document.addEventListener('input',ev=>{
  const e=ev.target;if(e.dataset.i==='q'){ui.q=e.value;const p=e.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if($('#modalBg').classList.contains('on'))closeModal();else if($('#drawer').classList.contains('on'))closeDrawer()}
  const t=ev.target.closest&&ev.target.closest('.tab');if(t&&(ev.key==='ArrowRight'||ev.key==='ArrowLeft')){const tabs=[...document.querySelectorAll('.tab')];const i=tabs.indexOf(t)+(ev.key==='ArrowRight'?1:-1);const n=tabs[(i+tabs.length)%tabs.length];n.click();setTimeout(()=>document.querySelector('.tab.on').focus(),0)}
});
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
try{if(localStorage.getItem('hkca.admin.dark')==='1')document.documentElement.classList.add('dark')}catch(e){}
function procEvents(announce){
  const sh=HKC.get();const ev=(sh.events||[]).filter(x=>x.seq>(S.evSeen||0));if(!ev.length)return false;
  ev.forEach(x=>{const r=S.rounds.find(y=>y.id===x.round),t=T(x.id);if(!r||!t)return;logAct(x.type==='apply'?'Course application received':'Course application withdrawn',`${t.name}: ${CNAME[r.course]} ${fmt(r.date)}`)});
  S.evSeen=ev[ev.length-1].seq;const l=ev[ev.length-1],r=S.rounds.find(y=>y.id===l.round),t=T(l.id);
  if(announce&&r&&t)toast(`${t.name} ${l.type==='apply'?'applied for':'withdrew from'} ${CNAME[r.course]}${ev.length>1?' and '+(ev.length-1)+' more':''}.`);
  save();return true;
}
window.addEventListener('storage',e=>{if(e.key!==HKC.KEY)return;S.rounds=HKC.get().rounds;procEvents(true);render()});
procEvents(false);
(function(){const h=location.hash.slice(1).split('/');if(VIEWS[h[0]]){ui.tab=h[0];if(h[1])ui.sub[h[0]]=h[1]}})();
render();
</script>
</body>
</html>
