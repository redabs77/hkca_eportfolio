<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HKCA e-Portfolio · College Secretariat Console (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--g300:#d4d4d4;--am700:#8f5d12;--rd700:#ac3f4c;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg2);color:var(--ink);line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased;transition:background-color .15s,color .15s}
.mono{font-family:'JetBrains Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1420px;margin:0 auto;padding:0 22px}
.hidden{display:none!important}
button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}

/* top bar + tabs (same frame as the SOT console) */
.top{position:sticky;top:0;z-index:80;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px) saturate(180%);border-bottom:1px solid var(--border)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:11px 0}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none}
.brand h1{font-size:14.5px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
.brand p{font-size:12px;color:var(--ink3);line-height:1.2}
.top-right{display:flex;align-items:center;gap:9px}
.icon-btn{width:32px;height:32px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;display:grid;place-items:center;cursor:pointer;font-size:15px}
.icon-btn:hover{background:var(--bg3)}
.who{display:flex;align-items:center;gap:9px;padding-left:11px;border-left:1px solid var(--border)}
.who .nm{font-size:12.5px;font-weight:650;line-height:1.2;text-align:right}
.who .rl{font-size:12px;color:var(--ink3);line-height:1.2;text-align:right}
.av{width:31px;height:31px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:650;flex:none}
.sub{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:70}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;font-size:13px;font-weight:550;color:var(--ink2);padding:13px 15px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--acc-t);border-bottom-color:var(--acc);font-weight:650}
.cnt{background:var(--bg3);color:var(--ink2);font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;font-family:'JetBrains Mono',monospace;min-width:18px;text-align:center}
.cnt.hot{background:var(--wn-bg);color:var(--wn-f)}
main{padding:24px 0 90px}

/* page head */
.pghead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.pgtitle{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.pgsub{font-size:13.5px;color:var(--ink2);margin-top:3px;max-width:70ch}
.meta{font-size:12.5px;color:var(--ink2)}
.muted{color:var(--ink3)}
.h3{font-size:14px;font-weight:650;letter-spacing:-.01em}

/* controls */
.seg{display:inline-flex;gap:3px;background:var(--bg3);padding:3px;border-radius:10px;border:1px solid var(--border-sub);flex-wrap:wrap}
.seg button{border:0;background:transparent;font-size:12.5px;font-weight:550;color:var(--ink2);padding:6px 13px;border-radius:7px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:var(--shadow);font-weight:650}
.btn{border:0;font-size:12.5px;font-weight:650;padding:7px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .14s}
.btn.pri{background:var(--acc);color:#fff}.btn.pri:hover{background:var(--acc-d)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--border)}.btn.sec:hover{background:var(--bg3)}
.btn.out{background:transparent;color:var(--acc-t);border:1px solid var(--acc)}.btn.out:hover{background:var(--acc-bg)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:0;color:var(--acc-t);font-weight:600;font-size:inherit;cursor:pointer;padding:0;text-align:left}
.linkbtn:hover{text-decoration:underline}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;max-width:100%}
textarea{width:100%;resize:vertical;line-height:1.5}
select{padding-right:26px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld>label,.lab{font-size:12px;font-weight:650;color:var(--ink2)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--ink2);font-size:12.5px;font-weight:550;padding:5px 11px;border-radius:999px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip:hover{border-color:var(--ink3)}
.chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc-t);font-weight:650}
.chip .n{font-size:11px;font-family:'JetBrains Mono',monospace;opacity:.85}
.toolbar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .grow{flex:1}

/* surfaces */
.card{background:var(--raised);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{text-align:left;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg2);position:sticky;top:0}
thead th:first-child{border-top-left-radius:14px}thead th:last-child{border-top-right-radius:14px}
thead th button{all:unset;cursor:pointer;display:inline-flex;gap:5px;align-items:center;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}
thead th button:hover{color:var(--ink)}
thead th button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
tbody td{padding:10px 14px;border-bottom:1px solid var(--border-sub);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--bg2)}
td.act,th.act{text-align:right;white-space:nowrap}
.cell-name{font-weight:600}
.cell-sub{font-size:12px;color:var(--ink3);margin-top:1px}
.grp td{background:var(--bg2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);padding:8px 14px}
.empty{padding:34px 20px;text-align:center;color:var(--ink3);font-size:13px}

/* status vocabulary: one saturated pill per row at most; secondary states are dot + text */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-f)}.pill.warn{background:var(--wn-bg);color:var(--wn-f)}.pill.bad{background:var(--bd-bg);color:var(--bd-f)}.pill.info{background:var(--in-bg);color:var(--in-f)}.pill.pur{background:var(--pp-bg);color:var(--pp-f)}.pill.mute{background:var(--bg3);color:var(--ink2)}
.dt{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink)}
.dt::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.dt.ok::before{background:var(--ok-f)}.dt.warn::before{background:#d99a2b}.dt.bad::before{background:var(--bd-f)}.dt.info::before{background:var(--in-f)}.dt.none::before{background:transparent;border:1.5px dashed var(--ink3)}
.stg{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;font-family:'JetBrains Mono',monospace;color:#1f2a44}
.stg.BAT{background:var(--s-bat)}.stg.HAT{background:var(--s-hat)}.stg.PFY{background:var(--s-pfy)}
.dark .stg{color:#0f1226}
.tick{color:var(--ok-f);font-weight:800}.cross{color:var(--bd-f);font-weight:800}

/* home: work queue */
.hm{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.q-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--border)}
.q-item{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:16px;align-items:center;padding:15px 20px 15px 0;border-bottom:1px solid var(--border-sub)}
.q-item:last-child{border-bottom:0}
.q-bar{align-self:stretch;border-radius:0 4px 4px 0}
.q-title{font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.q-why{font-size:12.5px;color:var(--ink2);margin-top:2px}
.q-wait{padding:13px 20px;font-size:13px;color:var(--ink2);border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
.q-clear{padding:15px 20px;font-size:13px;color:var(--ink2)}
.rail-card{padding:16px 18px;margin-bottom:16px}
.cal{display:grid;grid-template-columns:54px 1fr;gap:4px 12px;margin-top:10px;font-size:13px}
.cal .d{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2)}
.cal .w{color:var(--ink)}
.cal .w small{display:block;color:var(--ink3);font-size:12px}
.sync-line{display:flex;gap:9px;align-items:center;font-size:13px;margin-top:8px}

/* drawer + modal + toast */
.scrim{position:fixed;inset:0;background:rgba(20,18,40,.42);z-index:120;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--border);z-index:130;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s ease;box-shadow:var(--shadow-md)}
.drawer.on{transform:none}
.dr-h{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.dr-h h2{font-size:18px;letter-spacing:-.015em;font-weight:700;line-height:1.25}
.dr-b{flex:1;overflow:auto;padding:18px 22px}
.dr-f{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;background:var(--bg)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px;margin-bottom:16px}
.kv dt{color:var(--ink3)}.kv dd{color:var(--ink)}
.sect{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:20px 0 8px}
.sect:first-child{margin-top:0}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:13px}
.chk:hover{background:var(--bg2)}
.chk input{margin-top:3px}
.chk small{display:block;color:var(--ink3);font-size:12px}
.chk.done{background:var(--ok-bg);border-color:transparent}
.sigrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;font-size:13px}
.sigrow small{display:block;color:var(--ink3);font-size:12px}
.sigrow.done{background:var(--ok-bg);border-color:transparent}
.sigrow .acts{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.rtrail{display:grid;grid-template-columns:56px 1fr;gap:8px 12px;font-size:13px;margin-bottom:8px}
.rtrail .rt-d{color:var(--ink3);font-variant-numeric:tabular-nums}
.chipgrp{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.chipgrp+.chipgrp{padding-left:14px;border-left:1px solid var(--border-sub)}
.note{font-size:12.5px;color:var(--ink2);background:var(--bg2);border:1px solid var(--border-sub);border-radius:10px;padding:10px 12px;margin:10px 0}
.note.warn{background:var(--wn-bg);color:var(--wn-f);border-color:transparent}
.note.bad{background:var(--bd-bg);color:var(--bd-f);border-color:transparent}
.note.ok{background:var(--ok-bg);color:var(--ok-f);border-color:transparent}
.modal-bg{position:fixed;inset:0;background:rgba(20,18,40,.5);z-index:150;display:none;place-items:center;padding:20px}
.modal-bg.on{display:grid}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-md);width:min(520px,100%);max-height:88vh;overflow:auto;padding:22px 24px}
.modal h3{font-size:17px;letter-spacing:-.015em;margin-bottom:6px}
.modal .btn-row{justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:550;z-index:200;opacity:0;pointer-events:none;transition:all .2s;max-width:min(560px,92vw)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.demo-btn{position:fixed;right:16px;bottom:16px;z-index:90}
.demo-pop{position:fixed;right:16px;bottom:56px;z-index:91;width:240px;padding:14px;display:none}
.demo-pop.on{display:block}

/* course rounds, projects, small bars */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.round{display:block;width:100%;text-align:left;border:0;background:transparent;padding:13px 16px;border-bottom:1px solid var(--border-sub);cursor:pointer;color:var(--ink)}
.round:last-child{border-bottom:0}
.round:hover{background:var(--bg2)}
.round.on{background:var(--acc-bg);box-shadow:inset 3px 0 0 var(--acc)}
.round b{font-size:13.5px}
.seatbar{height:6px;background:var(--bg3);border-radius:4px;margin-top:8px;overflow:hidden}
.seatbar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.seatbar i.full{background:var(--ok-f)}
.pri-h{font-weight:700}.pri-m{font-weight:600;color:var(--ink2)}.pri-l{color:var(--ink3)}
.steps{display:flex;gap:8px;margin-bottom:14px;font-size:12.5px;color:var(--ink3);flex-wrap:wrap}
.steps span{padding:3px 10px;border-radius:999px;background:var(--bg3)}
.steps span.on{background:var(--acc-bg);color:var(--acc-t);font-weight:650}
.steps span.done{background:var(--ok-bg);color:var(--ok-f);font-weight:650}
.crit{display:flex;gap:6px;flex-wrap:wrap}
.crit i{font-style:normal;font-size:11.5px;font-weight:650;padding:1px 7px;border-radius:6px;background:var(--bg3);color:var(--ink3)}
.crit i.ok{background:var(--ok-bg);color:var(--ok-f)}.crit i.no{background:var(--bd-bg);color:var(--bd-f)}
.log-row{display:grid;grid-template-columns:96px 1fr;gap:3px 12px;padding:10px 0;border-bottom:1px solid var(--border-sub);font-size:13px}
.log-row .t{color:var(--ink3);font-variant-numeric:tabular-nums}
.log-row .h{grid-column:2;font-size:12px;color:var(--ink3);font-family:'JetBrains Mono',monospace}
details.fold{border:1px solid var(--border);border-radius:12px;background:var(--raised);margin-top:16px}
details.fold>summary{cursor:pointer;padding:13px 18px;font-weight:650;font-size:13.5px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";color:var(--ink3);font-weight:700}
details.fold[open]>summary::after{content:"\2013"}
details.fold .in{padding:0 18px 14px}
table.dk{table-layout:fixed}
@media(max-width:1000px){.hm,.split{grid-template-columns:1fr}.kv{grid-template-columns:120px 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="top"><div class="wrap top-row">
  <div class="brand"><div class="mark">H</div><div><h1>HKCA e-Portfolio</h1><p id="brandSub">College Secretariat Console</p></div></div>
  <div class="top-right">
    <button class="btn sec sm" data-a="openLog" title="Every action you take here is recorded">Activity log</button>
    <button class="icon-btn" id="themeBtn" data-a="theme" title="Toggle theme" aria-label="Toggle theme">&#9788;</button>
    <div class="who"><div><div class="nm" id="whoNm">College Secretariat</div><div class="rl" id="whoRl">Administrator</div></div><div class="av" id="whoAv">CS</div></div>
  </div>
</div></header>
<div class="sub"><div class="wrap"><nav class="tabs" role="tablist" aria-label="Console navigation" id="tabs"></nav></div></div>
<main><div class="wrap" id="app"></div></main>

<div class="scrim" id="scrim" data-a="closeDrawer"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drTitle"><div class="dr-h"><div><div class="eyebrow" id="drEye"></div><h2 id="drTitle"></h2></div><button class="icon-btn" data-a="closeDrawer" aria-label="Close">&times;</button></div><div class="dr-b" id="drBody"></div><div class="dr-f" id="drFoot"></div></aside>
<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-modal="true" id="modal"></div></div>
<div class="toast" id="toast" role="status"></div>
<button class="btn sec sm demo-btn" data-a="demoPop">Demo controls</button>
<div class="card demo-pop" id="demoPop"><div class="h3" style="margin-bottom:6px">Demo controls</div><p class="meta" style="margin-bottom:10px">All names, numbers and dates are illustrative. The prototype date is fixed at 24 Oct 2026.</p><div class="fld" style="margin-bottom:10px"><label for="roleSel">View as</label><select id="roleSel" data-c="role"><option value="admin">College Secretariat</option><option value="to">Training Officer</option></select></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><button class="btn sec sm" data-a="simSign">Simulate pending signatures arriving</button><button class="btn sec sm" data-a="simSubmit">Simulate applicants submitting documents</button><button class="btn sec sm" data-a="resetDemo">Reset demo data</button></div></div>
<script src="hkca-courses-store.js"></script>
<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TODAY='2026-10-24';
const D=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=d=>d.toISOString().slice(0,10);
const addDays=(i,n)=>iso(new Date(D(i).getTime()+n*864e5));
const days=(a,b)=>Math.round((D(b)-D(a))/864e5);
const fmt=i=>{if(!i)return '';const d=D(i);return d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+d.getUTCFullYear()};
const fmtS=i=>{if(!i)return '';const d=D(i);return d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const ago=n=>n<=0?'today':n===1?'1 day':n+' days';
const plural=(n,a,b)=>n+' '+(n===1?a:(b||a+'s'));

/* ============ reference data ============ */
const HOSP=[['HKE','PYNEH'],['HKE','RH'],['HKW','QMH'],['HKW','GH'],['KCC','HKBH'],['KCC','HKEH'],['KCC','KWH'],['KCC','QEH'],['KEC','TKOH'],['KEC','UCH'],['KWC','CMC'],['KWC','NLTH'],['KWC','PMH'],['KWC','YCH'],['NTE','AHNH'],['NTE','NDH'],['NTE','PWH'],['NTW','POH'],['NTW','TMH'],['NTW','TSWH']];
const CLUSTER=Object.fromEntries(HOSP.map(([c,h])=>[h,c]));
const COURSES={EASE:'Exposure to Anaesthetic Safety & Emergencies',EMAC:'Effective Management of Anaesthetic Crises',ADAMA:'Advanced & Difficult Airway Workshop for Anaesthesiologists',ECHOA:'Focused Transthoracic Echocardiography Workshop for Anaesthetists',UGRA:'Ultrasound-Guided Regional Anaesthesia \u2013 Elementary',ADAMD:'Advanced Difficult Airway Management for Doctors',ASSW:'Advanced Sedation Safety Workshop',BSC:'Basic Sciences Course in Anaesthesiology',IMV:'Intermediate Examination Mock Viva',RTB:'Revision Tutorial Course in Basic Sciences in Anaesthesiology',HTC:'Higher Training Course in Clinical Anaesthesia',CRASH:'Crash Course for Clinical Anaesthesiology',RTC:'Revision Tutorial Course in Clinical Anaesthesiology'};
const CNAME={EASE:'EASE',EMAC:'EMAC',ECHOA:'ECHO-A',ADAMA:'ADAM-A',UGRA:'UGRA',ADAMD:'ADAM-D',ASSW:'ASSW',BSC:'Basic Sciences Course',IMV:'Intermediate Mock Viva',RTB:'Revision Tutorial (Basic Sciences)',HTC:'Higher Training Course',CRASH:'Crash Course',RTC:'Revision Tutorial (Clinical)'};

function critOf(t){
  const g=S.GATES[t.stage];const d=S.dk[t.id]||{fail:{}};const f=d.fail;
  const need=g.next==='Exit'?['EASE','EMAC','ECHOA','ADAMA','UGRA']:g.next==='PFY'?['EASE','EMAC']:['EASE'];
  const miss=need.filter(c=>!t.courses.includes(c));
  const out={time:!f.time,courses:miss.length===0&&!f.courses,wba:!f.wba,vop:!f.vop,ita:!f.ita,exam:!f.exam};
  const why={time:f.time||'',courses:miss.length?CNAME[miss[0]]+(miss.length>1?' and '+(miss.length-1)+' more':'')+' outstanding':(f.courses||''),wba:f.wba||'',vop:f.vop||'',ita:f.ita||'',exam:f.exam||''};
  if(g.next==='Exit'){out.project=!f.project;why.project=f.project||''}
  return {out,why,ready:Object.values(out).every(Boolean),miss};
}

  if(c.pend)q.push({col:'--t2f',t:'SOT appointment to enter',w:'The Board endorsed the replacement at '+S.pendingAppt[0].hosp+'. Record the appointment before the current term ends.',go:['centres','appts'],b:'Open appointments'});
  if(c.unm)q.push({col:'--acc',t:plural(c.unm,'iWBA item')+' not mapped',w:'These assessments are held back until each is matched to a curriculum code.',go:['wba','unmapped'],b:'Map items'});
  const waiting=[];
  const wRecog=S.recog.filter(r=>r.state==='waiting').length;if(wRecog)waiting.push(plural(wRecog,'retrospective recognition request')+' with the applicant');const wTo=S.recog.filter(r=>r.state==='to').length;if(wTo)waiting.push(plural(wTo,'retrospective recognition request')+' with the Training Officer');
  const wRev=S.projects.filter(p=>p.state==='review'&&p.due>=TODAY).length;if(wRev)waiting.push(plural(wRev,'project review')+' with assessors');
  waiting.push('JCIMED: '+S.jcimed.length+' questions sent 23 Oct');

  const calR=S.rounds.filter(r=>['open','closed'].includes(rState(r))).sort((a,b)=>a.date>b.date?1:-1).slice(0,2).map(r=>[fmtS(r.date),CNAME[r.course]+' round',seatTxt(r)+(rState(r)==='open'?'. Registration closes '+fmtS(r.closes):'. Registration closed')]);
  const cal=[...calR,['1 Dec','Roster attestation opens','SOTs confirm trainee lists'],['Dec','Training Progression',dk+' trainees in a gate window'],['31 Dec','TKOH SOT term ends','Replacement endorsed'],['Mar 2027','PYNEH accreditation expires','Renewal inspection due']];
  return head('Friday 24 October 2026','Work queue','What needs the Secretariat, most time-sensitive first.')+
  `<div class="hm"><div class="card"><div class="q-h"><div class="h3">Needs you</div><span class="meta">${q.length?plural(q.length,'item'):'Nothing open'}</span></div>
  ${q.length?q.map(x=>`<div class="q-item"><div class="q-bar" style="background:var(${x.col})"></div><div><div class="q-title">${x.t}</div><div class="q-why">${x.w}</div></div><button class="btn pri sm" data-a="go" data-t="${x.go[0]}" data-k="${x.go[1]}">${x.b}</button></div>`).join(''):'<div class="q-clear">Everything is cleared. New items appear here as trainees, SOTs and iWBA create them.</div>'}
  <div class="q-wait"><b class="muted">Waiting on others</b><span>${waiting.join(' &middot; ')}</span></div></div>

  <div class="card rail-card"><div class="eyebrow">iWBA sync</div><div class="sync-line">${dt('Healthy','ok')}</div><p class="meta" style="margin-top:6px">Last read ${S.sync.last.slice(11)} today, ${S.sync.read} records, ${S.sync.fail} failures. History backfill is ${S.sync.backfill.toLowerCase()}.</p><p style="margin-top:8px"><button class="linkbtn" data-a="go" data-t="wba" data-k="link">Open iWBA sync</button></p></div></aside></div>`;
}

  <select data-c="status" aria-label="Status">${['All','Active','On leave','Deactivated','Completed'].map(x=>`<option value="${x}" ${ui.status===x?'selected':''}>${x==='All'?'Any status':x}</option>`).join('')}</select>
  <select data-c="hosp" aria-label="Hospital"><option value="All">Any hospital</option>${HOSP.map(h=>`<option ${ui.hosp===h[1]?'selected':''}>${h[1]}</option>`).join('')}</select>
  <span class="meta grow" style="text-align:right">${rows.length} of ${S.trainees.length}</span></div>
  <div class="card"><div class="tbl-scroll"><table><thead><tr>${thSort('name','Trainee')}${thSort('stage','Stage')}${thSort('hosp','Hospital')}${thSort('status','Status')}<th>Curriculum</th><th class="act"></th></tr></thead><tbody>
  ${rows.map(t=>`<tr><td><div class="cell-name">${esc(t.name)}</div><div class="cell-sub mono">${t.id}</div></td><td>${stg(t.stage)} <span class="meta">month ${t.months}</span></td><td>${t.hosp} <span class="cell-sub">${CLUSTER[t.hosp]||''}</span></td><td>${dt(t.status,stat(t.status))}</td><td class="meta">${esc(t.edition)}</td><td class="act"><button class="btn sec sm" data-a="openTrainee" data-id="${t.id}">Open</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No trainee matches these filters.</td></tr>'}

/* membership application */

function vIntake(){
  if(!S.intake.length)return `<div class="card"><div class="empty">No applications waiting. New ones from the online application form appear here.</div></div>`;
  return `<div class="card"><div class="tbl-scroll"><table><thead><tr><th>Applicant</th><th>Submitted</th><th>Checks</th><th class="act"></th></tr></thead><tbody>${S.intake.map(a=>{const n=intakeN(a);return `<tr><td><div class="cell-name">${esc(a.name)}</div><div class="cell-sub">${esc(a.from)}</div></td><td>${fmt(a.submitted)} <span class="cell-sub">waiting ${ago(days(a.submitted,TODAY))}</span></td><td>${dt(n+' of 3 checked',n===3?'ok':n?'warn':'none')}</td><td class="act"><button class="btn pri sm" data-a="openIntake" data-id="${a.id}">Review</button></td></tr>`}).join('')}</tbody></table></div></div>`;

function intakeBody(a){

function sigRemind(id,w){const a=S.intake.find(x=>x.id===id);logAct('Signing reminder sent',`${a.name}: ${SIGWHO[w]}, ${a.hosp}`);toast('Reminder sent to the '+SIGWHO[w]+' at '+a.hosp+'.')}
function sigPdf(id,w){const a=S.intake.find(x=>x.id===id);a.sig[w]={m:'pdf',d:TODAY};logAct('Endorsement PDF attached',`${a.name}: ${SIGWHO[w]}, ${a.hosp}`);refreshIntake(a);toast('Signed PDF recorded for the '+SIGWHO[w]+'.')}
function simSign(){S.intake.forEach(a=>['cos','sot'].forEach(w=>{if(!a.sig[w])a.sig[w]={m:'esign',d:TODAY}}));save();$('#demoPop').classList.remove('on');if(ui.dr&&ui.dr.type==='intake'){const a=S.intake.find(x=>x.id===ui.dr.id);if(a)refreshIntake(a);else render()}else render();toast('Pending signatures arrived (demo).')}

function approveIntake(id){

  const num='HKCA-2026-'+String(40+S.trainees.filter(t=>t.id.startsWith('HKCA-2026')).length+1).padStart(3,'0');

function doReturn(id){const w=$('#rtWhy').value.trim();if(!w){toast('Say what needs fixing.');return}const a=S.intake.find(x=>x.id===id);S.intake=S.intake.filter(x=>x.id!==id);logAct('Membership application returned',`${a.name}: ${w}`);closeModal();closeDrawer();render();toast('Application returned to '+a.name+'.')}

/* docket */
const CRIT=[['time','Time'],['courses','Courses'],['wba','WBA'],['vop','Logbook'],['ita','ITA'],['exam','Exam']];
const critFor=t=>S.GATES[t.stage].next==='Exit'?[...CRIT,['project','Formal project']]:CRIT;
const CG='<colgroup><col style="width:48px"><col style="width:27%"><col style="width:22%"><col></colgroup>';
const GK=['BAT','HAT','PFY'];
const dkInScope=x=>ui.dkGate==='All'||x.t.stage===ui.dkGate;
const dkVisible=()=>docketRows().filter(x=>dkInScope(x)&&(ui.dkStat==='All'||(ui.dkStat==='ready')===x.c.ready));
const dkSelected=()=>dkVisible().filter(x=>x.c.ready&&ui.docketSel[x.t.id]).map(x=>x.t.id);
function vDocket(){
  const all=docketRows();const vis=dkVisible();const sel=dkSelected();
  const crit=(c,t)=>`<div class="crit">${critFor(t).map(([k,l])=>`<i class="${c.out[k]?'ok':'no'}">${c.out[k]?'\u2713':'\u2715'} ${l}</i>`).join('')}</div>`;
  const row=(x,r)=>{const g=S.GATES[x.t.stage];const out=critFor(x.t).filter(([k])=>!x.c.out[k]);return `<tr>${r?`<td style="width:34px"><input type="checkbox" data-c="dkSel" data-id="${x.t.id}" ${ui.docketSel[x.t.id]?'checked':''} aria-label="Select ${esc(x.t.name)}"></td>`:'<td></td>'}<td><div class="cell-name">${esc(x.t.name)}</div><div class="cell-sub">${x.t.hosp} <span class="mono">${x.t.id}</span></div></td><td>month ${x.t.months} of ${g.to}<div class="cell-sub">${r?dt('Ready to advance','ok'):dt(out.length+' outstanding','warn')}</div></td><td>${r?crit(x.c,x.t):`<div>${out.map(([k,l])=>`<div class="cell-sub" style="color:var(--bd-f)"><b>${l}:</b> ${esc(x.c.why[k])}</div>`).join('')}</div>`}</td></tr>`};
  const gcard=g=>{const G=S.GATES[g];const rows=vis.filter(x=>x.t.stage===g);const rd=rows.filter(x=>x.c.ready),at=rows.filter(x=>!x.c.ready);
    if(!rows.length&&ui.dkStat!=='All')return '';
    return `<div class="card" style="margin-bottom:18px"><div class="q-h"><div class="h3">${G.label} <span class="cnt">${rows.length}</span></div><div class="btn-row"><span class="meta">${rd.length} ready, ${at.length} need attention. Window: month ${G.from} to ${G.to}.</span><button class="btn sec sm" data-a="dkAll" data-g="${g}" ${rd.length?'':'disabled'}>Select all ready</button></div></div>
    <div class="tbl-scroll"><table class="dk">${CG}<tbody>${(rd.map(x=>row(x,true)).join('')+at.map(x=>row(x,false)).join(''))||'<tr><td colspan="4" class="empty">Nobody is in this gate window.</td></tr>'}</tbody></table></div></div>`};
  const gn=g=>all.filter(x=>g==='All'||x.t.stage===g).length;
  const sn=k=>all.filter(x=>dkInScope(x)&&(k==='All'||(k==='ready')===x.c.ready)).length;
  const gates=ui.dkGate==='All'?GK:[ui.dkGate];
  const cards=gates.map(gcard).join('');
  return `<div class="toolbar"><div class="chipgrp" role="group" aria-label="Gate">${['All',...GK].map(g=>`<button class="chip ${ui.dkGate===g?'on':''}" aria-pressed="${ui.dkGate===g}" data-a="fDkGate" data-v="${g}">${g==='All'?'All gates':S.GATES[g].label} <span class="n">${gn(g)}</span></button>`).join('')}</div>
  <div class="chipgrp" role="group" aria-label="Status">${[['All','Everyone'],['ready','Ready'],['attn','Needs attention']].map(([k,l])=>`<button class="chip ${ui.dkStat===k?'on':''}" aria-pressed="${ui.dkStat===k}" data-a="fDkStat" data-v="${k}">${l} <span class="n">${sn(k)}</span></button>`).join('')}</div>
  <span class="grow"></span><button class="btn pri sm" data-a="dkGo" ${sel.length?'':'disabled'}>Advance ${sel.length||''} selected</button></div>
  ${cards.trim()?cards:'<div class="card"><div class="empty">Nobody matches these filters.</div></div>'}
  <p class="meta" style="margin-top:12px">Criteria shown are illustrative. The real thresholds come from the curriculum edition each trainee is bound to.</p>`;
}
function dkGo(){
  const ids=dkSelected();const ts=ids.map(T).filter(Boolean);
  openModal(`<h3>Advance ${plural(ts.length,'trainee')}?</h3><p class="meta" style="margin:6px 0 12px">Each trainee moves to the next stage today and is notified. Stage history keeps the date and who made the change.</p><ul style="padding-left:18px;font-size:13px;line-height:1.8">${ts.map(t=>`<li>${esc(t.name)}: ${t.stage} &rarr; ${S.GATES[t.stage].next==='Exit'?'completed training':S.GATES[t.stage].next}</li>`).join('')}</ul><div class="btn-row"><button class="btn sec" data-a="closeModal">Cancel</button><button class="btn pri" data-a="dkDo">Advance</button></div>`);
}
function dkDo(){
  const ids=dkSelected();
  ids.forEach(id=>{const t=T(id);if(!t)return;const g=S.GATES[t.stage];if(g.next==='Exit'){t.status='Completed'}else{t.stage=g.next}logAct('Stage advanced',`${t.name} (${t.id}): ${g.label}`)});
  ui.docketSel={};closeModal();render();toast(plural(ids.length,'trainee')+' advanced.')
}

/* recognition */
const RSTATE={gate:['Request access','info'],waiting:['With applicant','mute'],docs:['Check documents','warn'],to:['With Training Officer','mute'],board:['Needs Board decision','warn'],approved:['Approved, credit to execute','info'],done:['Credit executed','ok']};
const srcTxt=r=>r.origin.kind==='overseas'?'Anaesthesia training overseas: '+r.origin.where:'Other specialty: '+r.origin.spec+', '+r.origin.where;
const DOCREQ=['Letter or certificate from the previous training body','Record of posts held, with dates','Logbook or case summary'];
const reasonOf=r=>r.origin.kind==='overseas'?'RETROSPECTIVE_OVERSEAS_RECOGNITION':'RETROSPECTIVE_SPECIALTY_TRANSFER';
const rtr=(r,who,ev,note)=>{r.trail.push({d:TODAY,who,ev,note:note||''})};
const rtrailHtml=r=>`<div class="sect">Decision trail</div><div class="rtrail">${r.trail.map(x=>`<div class="rt-d">${fmtS(x.d)}</div><div><b>${esc(x.ev)}</b> <span class="meta">${esc(x.who)}</span>${x.note?`<div class="meta">${esc(x.note)}</div>`:''}</div>`).join('')}</div>`;
const monthFields=(p,v,ro)=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px"><div class="fld"><label for="${p}CA">Clinical anaesthesia (months)</label><input type="number" id="${p}CA" min="0" max="72" value="${v.CA}" ${ro?'disabled':''}></div><div class="fld"><label for="${p}ICU">Intensive care (months)</label><input type="number" id="${p}ICU" min="0" max="6" value="${v.ICU}" ${ro?'disabled':''}></div><div class="fld"><label for="${p}EL">Elective (months)</label><input type="number" id="${p}EL" min="0" max="18" value="${v.EL}" ${ro?'disabled':''}></div><div class="fld"><label for="${p}CS">Logbook cases recognised</label><input type="number" id="${p}CS" min="0" value="${v.cases}" ${ro?'disabled':''}></div></div>`;
const readM=p=>({CA:+$('#'+p+'CA').value||0,ICU:+$('#'+p+'ICU').value||0,EL:+$('#'+p+'EL').value||0,cases:+$('#'+p+'CS').value||0});
const recReq=r=>r.req?`<div class="sect">Requested by the applicant</div><dl class="kv"><dt>Clinical anaesthesia</dt><dd>${r.req.CA} months</dd><dt>Intensive care</dt><dd>${r.req.ICU} months</dd><dt>Elective</dt><dd>${r.req.EL} months</dd><dt>Logbook cases</dt><dd>${r.req.cases}</dd></dl>`:'';
function recDocs(r,edit){
  const req=DOCREQ;
  return `<div class="sect">Documents</div>${req.map((n,i)=>edit?`<label class="chk ${r.rc[i]?'done':''}"><input type="checkbox" data-c="recRc" data-id="${r.id}" data-i="${i}" ${r.rc[i]?'checked':''}><span>${n}<small>Received and readable</small></span></label>`:`<div class="chk ${r.rc[i]?'done':''}" style="cursor:default"><span>${n}${r.rc[i]?'':'<small>Not received</small>'}</span></div>`).join('')}<p class="meta"><button class="linkbtn" data-a="toast" data-m="Opens the uploaded documents (demo)">View uploaded documents</button></p>`;
}
function vRecog(){
  const act={gate:['Enable application','pri'],waiting:['View','sec'],docs:['Check documents','pri'],to:['View','sec'],board:['Record decision','pri'],approved:['Execute credit','pri'],done:['View','sec']};
  return `<div class="card"><div class="tbl-scroll"><table><thead><tr><th>Applicant</th><th>Prior training</th><th>Status</th><th class="act"></th></tr></thead><tbody>${S.recog.map(r=>{const a=act[r.state];return `<tr><td><div class="cell-name">${esc(r.name)}</div><div class="cell-sub mono">${r.id}</div></td><td>${esc(srcTxt(r))}</td><td>${pill(RSTATE[r.state][0],RSTATE[r.state][1])}</td><td class="act"><button class="btn ${a[1]} sm" data-a="openRecog" data-id="${r.id}">${a[0]}</button></td></tr>`}).join('')}</tbody></table></div></div>`;
}
function openRecog(id){
  const r=S.recog.find(x=>x.id===id);ui.dr={type:'recog',id};
  const sinceL={gate:'Asked',waiting:'Application enabled',docs:'Submitted',to:'Sent to Training Officer',board:'Referred to the Board',approved:'Approved by Training Officer',done:'Decided'}[r.state];
  const since=r.state==='approved'?r.grant.date:r.state==='done'?r.credit.date:r.asked;
  const top=`<dl class="kv"><dt>Prior training</dt><dd>${esc(srcTxt(r))}</dd><dt>${sinceL}</dt><dd>${fmt(since)}</dd></dl>`;
  let body='',foot='';
  if(r.state==='gate'){body=top+`<p class="note">The trainee cannot apply for retrospective recognition until you enable the application for them. After that they upload documents and state what they are asking for.</p>`;foot=`<button class="btn sec" data-a="closeDrawer">Cancel</button><button class="btn pri" data-a="unlockRecog" data-id="${id}">Enable application</button>`}
  else if(r.state==='waiting'){body=top+`<p class="note">Waiting for the applicant to upload documents. This moves to your list when they submit.</p>`}
  else if(r.state==='docs'){body=top+(r.toNote?`<p class="note warn"><b>The Training Officer asked for more documents:</b> ${esc(r.toNote)}</p>`:'')+recReq(r)+recDocs(r,true)+`<p class="meta">When every document is in, send the pack to the Training Officer to vet.</p>`;foot=`<button class="btn sec" data-a="returnRecog" data-id="${id}">Return to applicant</button><button class="btn pri" id="sendToBtn" data-a="sendTO" data-id="${id}" ${r.rc.every(Boolean)?'':'disabled'}>Send to Training Officer</button>`}
  else if(r.state==='to'){body=top+recReq(r)+recDocs(r,false)+`<p class="note">With the Training Officer. It returns here only if they refer it to the Board or ask for more documents. If they approve, it comes to you to execute the credit.</p>`;foot=`<button class="btn sec" data-a="closeDrawer">Close</button><button class="btn sec" data-a="openToForm" data-id="${id}" data-b="1">Record outcome for them</button>`}
  else if(r.state==='board'||r.state==='approved'){
    const ap=r.state==='approved';const v=ap?r.grant:r.req;
    body=top+recReq(r)+recDocs(r,false)+`<div class="sect">${ap?'Training Officer\'s decision':'Board decision'}</div>${ap?`<p class="note ok">No particular issues were raised, so the Training Officer's vetting is the decision. Check the figures and execute.</p>`:(r.referNote?`<p class="note warn"><b>Referred by the Training Officer:</b> ${esc(r.referNote)}</p>`:'')}${monthFields('g',v,ap)}<div class="fld"><label for="gDate">Date of ${ap?'the Training Officer\'s':'the Board'} decision</label><input type="date" id="gDate" max="${TODAY}" value="${ap?r.grant.date:TODAY}" ${ap?'disabled':''}></div><dl class="kv"><dt>Reason code</dt><dd class="mono" style="font-size:12px">${reasonOf(r)}</dd></dl>`+rtrailHtml(r);
    foot=`<button class="btn sec" data-a="closeDrawer">Cancel</button><button class="btn pri" data-a="reviewCredit" data-id="${id}">Review and execute</button>`}
  else{const c=r.credit;body=top+`<dl class="kv"><dt>Decided by</dt><dd>${esc(c.by||'Board')}</dd><dt>Reason code</dt><dd class="mono" style="font-size:12px">${c.reason}</dd></dl><div class="sect">Credit written to the ledger</div><dl class="kv"><dt>Clinical anaesthesia</dt><dd>${c.CA} months</dd><dt>Intensive care</dt><dd>${c.ICU} months</dd><dt>Elective</dt><dd>${c.EL} months</dd><dt>Logbook cases</dt><dd>${c.cases}</dd></dl><p class="note">Ledger rows are permanent. A later correction is a new row with its own reason code, approved by the Board.</p>`}
  if(r.state!=='board'&&r.state!=='approved')body+=rtrailHtml(r);
  openDrawer(r.id,r.name,body,foot);
}
function refreshRecog(r){openRecog(r.id);render()}
function unlockRecog(id){const r=S.recog.find(x=>x.id===id);r.state='waiting';r.asked=TODAY;rtr(r,'Secretariat','Application enabled');logAct('Retrospective application enabled',r.name);closeDrawer();render();toast('Application enabled for '+r.name+'.')}
function sendTO(id){const r=S.recog.find(x=>x.id===id);if(!r.rc.every(Boolean))return;r.state='to';r.asked=TODAY;r.toNote='';rtr(r,'Secretariat','Documents checked, sent to the Training Officer');logAct('Sent to Training Officer',r.name+', '+srcTxt(r));closeDrawer();render();toast('Sent to the Training Officer.')}
function returnRecog(id){const r=S.recog.find(x=>x.id===id);openModal(`<h3>Return ${esc(r.name)}'s documents</h3><p class="meta" style="margin-bottom:12px">The applicant sees your note and can upload again.</p><div class="fld"><label for="rcWhy">What is missing or unreadable</label><textarea id="rcWhy" rows="3"></textarea></div><div class="btn-row"><button class="btn sec" data-a="closeModal">Cancel</button><button class="btn pri" data-a="doRecogReturn" data-id="${id}">Return to applicant</button></div>`)}
function doRecogReturn(id){const w=$('#rcWhy').value.trim();if(!w){toast('Say what is missing.');return}const r=S.recog.find(x=>x.id===id);r.state='waiting';r.asked=TODAY;rtr(r,'Secretariat','Returned to the applicant',w);logAct('Retrospective documents returned',r.name+': '+w);closeModal();closeDrawer();render();toast('Returned to '+r.name+'.')}
function simSubmit(){S.recog.forEach(r=>{if(r.state==='waiting'){r.state='docs';r.asked=TODAY;r.req=r.req||{CA:6,ICU:0,EL:0,cases:60};r.rc=[false,false,false];rtr(r,r.name,'Submitted form and documents')}});save();$('#demoPop').classList.remove('on');closeDrawer();render();toast('Applicants submitted (demo).')}

const toOutcome=r=>{const x=[...r.trail].reverse().find(y=>/Training Officer/.test(y.who));return x?x.ev:''};
function toTab(){const n=S.recog.filter(r=>r.state==='to').length;return `<button class="tab on" role="tab" aria-selected="true">Retrospective vetting${n?` <span class="cnt hot">${n}</span>`:''}</button>`}
function roleChrome(){const to=ui.role==='to';$('#brandSub').textContent=to?'Training Officer view':'College Secretariat Console';$('#whoNm').textContent=to?'Training Officer':'College Secretariat';$('#whoRl').textContent=to?'Retrospective vetting':'Administrator';$('#whoAv').textContent=to?'TO':'CS';$('#roleSel').value=ui.role}

}
function openToView(id){const r=S.recog.find(x=>x.id===id);ui.dr={type:'toview',id};openDrawer(r.id,r.name,`<dl class="kv"><dt>Prior training</dt><dd>${esc(srcTxt(r))}</dd></dl>${recReq(r)}${recDocs(r,false)}${rtrailHtml(r)}`,'')}
function openToForm(id,behalf){
  const r=S.recog.find(x=>x.id===id);ui.dr={type:'to',id};
  openDrawer(r.id,r.name,`<dl class="kv"><dt>Prior training</dt><dd>${esc(srcTxt(r))}</dd><dt>Sent</dt><dd>${fmt(r.asked)}</dd></dl>${behalf?'<p class="note warn">Recording on behalf of the Training Officer, from an outcome received outside the system. This is noted in the decision trail.</p>':''}${recReq(r)}${recDocs(r,false)}${rtrailHtml(r)}
  <div class="sect">${behalf?'Training Officer\'s outcome':'Your outcome'}</div>
  <label class="chk"><input type="radio" name="toOut" value="approve" data-c="toOut" checked><span>Approve<small>No particular issues. Your vetting is the decision.</small></span></label>
  <label class="chk"><input type="radio" name="toOut" value="refer" data-c="toOut"><span>Refer to the Board<small>There is a problem the Board should decide.</small></span></label>
  <label class="chk"><input type="radio" name="toOut" value="docs" data-c="toOut"><span>More documents needed<small>Goes back to the Secretariat.</small></span></label>
  <div id="toApprove"><div class="sect">Credit to give</div>${monthFields('t',r.req)}</div>
  <div class="fld"><label for="toNote" id="toNoteL">Note (needed only if you change the figures)</label><textarea id="toNote" rows="3" placeholder="Recorded in the decision trail"></textarea></div>`,
  `<button class="btn sec" data-a="closeDrawer">Cancel</button><button class="btn pri" data-a="toSubmit" data-id="${id}" data-b="${behalf?1:0}">Record outcome</button>`);
}
function toOutChange(v){$('#toApprove').style.display=v==='approve'?'':'none';$('#toNoteL').textContent=v==='approve'?'Note (needed only if you change the figures)':v==='refer'?'Why it needs the Board':'What documents are needed'}
function toSubmit(id,behalf){
  const r=S.recog.find(x=>x.id===id);const out=document.querySelector('input[name=toOut]:checked').value;const note=$('#toNote').value.trim();
  const who=behalf?'Secretariat, for the Training Officer':'Training Officer';
  if(out==='approve'){
    const g=readM('t');const diff=['CA','ICU','EL','cases'].filter(k=>g[k]!==r.req[k]);
    if(diff.length&&!note){toast('Say why the figures differ from the request.');$('#toNote').focus();return}
    r.grant=Object.assign(g,{date:TODAY});r.state='approved';rtr(r,who,diff.length?'Approved with different figures':'Approved as requested',note);
    logAct('Retrospective recognition approved',`${r.name}: CA ${g.CA}, ICU ${g.ICU}, EL ${g.EL} months, ${g.cases} cases. Decided by the Training Officer${behalf?' (recorded by the Secretariat)':''}`);
  }else if(out==='refer'){
    if(!note){toast('Say why it needs the Board.');$('#toNote').focus();return}
    r.state='board';r.referNote=note;rtr(r,who,'Referred to the Board',note);logAct('Retrospective recognition referred to the Board',r.name+': '+note);
  }else{
    if(!note){toast('Say what documents are needed.');$('#toNote').focus();return}
    r.state='docs';r.toNote=note;r.asked=TODAY;rtr(r,who,'Asked for more documents',note);logAct('Retrospective recognition: more documents asked',r.name+': '+note);
  }
  closeDrawer();render();toast(out==='approve'?'Approved. The Secretariat will execute the credit.':out==='refer'?'Referred to the Board.':'Returned to the Secretariat.')
}
function reviewCredit(id){
  const r=S.recog.find(x=>x.id===id);const ap=r.state==='approved';const by=ap?'Training Officer':'Board';
  const g=Object.assign(readM('g'),{date:ap?r.grant.date:$('#gDate').value,reason:reasonOf(r),by});
  if(!g.date||g.date>TODAY){toast('Enter the decision date. It cannot be in the future.');return}
  const over=['CA','ICU','EL','cases'].filter(k=>g[k]>r.req[k]);
  ui.pendingCredit={id,g};
  openModal(`<h3>Write credit for ${esc(r.name)}?</h3><dl class="kv" style="margin-top:12px"><dt>Clinical anaesthesia</dt><dd>${g.CA} months</dd><dt>Intensive care</dt><dd>${g.ICU} months</dd><dt>Elective</dt><dd>${g.EL} months</dd><dt>Logbook cases</dt><dd>${g.cases}</dd><dt>Decided by</dt><dd>${by}, ${fmt(g.date)}</dd></dl>${over.length?'<p class="note warn">One or more figures are above what the applicant asked for.</p>':''}<p class="meta">This writes permanent ledger rows. It cannot be edited afterwards, only corrected by a new Board-approved row.</p><div class="btn-row"><button class="btn sec" data-a="closeModal">Go back</button><button class="btn pri" data-a="execCredit">Execute credit</button></div>`);
}
function execCredit(){const {id,g}=ui.pendingCredit;const r=S.recog.find(x=>x.id===id);r.credit=g;r.state='done';rtr(r,'Secretariat','Credit written to the ledger',g.by+' decision of '+fmtS(g.date));logAct('Retrospective credit executed',`${r.name}: CA ${g.CA}, ICU ${g.ICU}, EL ${g.EL} months, ${g.cases} cases. ${g.reason}. Decided by ${g.by}`);closeModal();closeDrawer();render();toast('Credit written for '+r.name+'.')}

/* ============ COURSES ============ */
const PR={h:['High','pri-h'],m:['Medium','pri-m'],l:['Low','pri-l'],n:['Standard','pri-l']};
const hk=n=>'HK$'+Number(n).toLocaleString('en-US');
const noCharge=r=>r.feeM===0&&r.feeN===0;
const feeLine=r=>noCharge(r)?'No charge':r.feeM===r.feeN?hk(r.feeM):hk(r.feeM)+' member / '+hk(r.feeN)+' non-member';
const feeCell=r=>r.feeM==null?'<span class="pill warn">Fee not set</span>':noCharge(r)?'No charge':r.feeM===r.feeN?`${hk(r.feeM)}<div class="cell-sub">Same for non-members</div>`:`${hk(r.feeM)}<div class="cell-sub">${hk(r.feeN)} non-member</div>`;
const rEnd=r=>r.end||r.date;
const isMand=k=>MAND.includes(k);
const orgOf=k=>CSC.includes(k)?'Clinical Simulation Committee':'HKCA';
function rState(r){
  if(r.recorded)return 'recorded';
  if(rEnd(r)<TODAY)return 'held';
  if(r.shut||(r.closes&&r.closes<TODAY))return 'closed';
  if(r.opens>TODAY)return 'scheduled';
  return 'open';
}
const undecided=r=>r.apps.filter(a=>a[2]==='Requested').length;
function rPill(r){
  const s=rState(r);
  if(s==='scheduled')return pill('Opens '+fmtS(r.opens),'info');
  if(s==='open')return pill('Open until '+fmtS(r.closes),'ok');
  if(s==='closed'){const u=undecided(r);return u?pill('Closed, '+u+' to decide','warn'):pill('Closed','mute')}
  if(s==='held')return pill('Held, record attendance','warn');
  return pill('Attendance recorded','mute');
}
function prio(id,course){
  const t=T(id);if(!t)return ['l','Not on file'];
  if(course==='EASE')return t.stage==='BAT'?['h','Needed early in basic training']:['m','Past the usual stage'];
  if(course==='EMAC'||course==='ECHOA')return t.stage==='BAT'?['l','Not yet needed']:['h','Needed before the exit examination'];
  return t.stage==='PFY'?['h','Few sittings left before exit']:t.stage==='HAT'?['m','Needed before the exit examination']:['l','Not yet needed'];
}
function aboutToProgress(t,key){
  if(!isMand(key)||t.status!=='Active')return null;
  const g=S.GATES[t.stage];if(!g||t.months<g.from||t.months>g.to)return null;
  return critOf(t).miss.includes(key)?g.label:null;
}
const wlBefore=(r,id)=>S.rounds.some(x=>x.course===r.course&&x.id!==r.id&&x.date<r.date&&x.apps.some(a=>a[0]===id&&a[2]==='Waitlisted'));
function appInfo(r,a){
  const t=T(a[0]);const wl=wlBefore(r,a[0]);const pg=t?aboutToProgress(t,r.course):null;
  const ix=r.course==='IMV'&&S.exCands.some(x=>x.id===a[0]&&x.exam==='Intermediate');
  let lvl='n',base='';if(isMand(r.course)){const p=prio(a[0],r.course);lvl=p[0];base=p[1]}
  if(wl||pg||ix)lvl='h';
  const why=[];if(wl)why.push('Waitlisted for an earlier round');if(pg)why.push('About to progress ('+pg+')');if(ix)why.push('Sitting the coming Intermediate examination');if(base&&!pg)why.push(base);
  const score=(wl?100:0)+(ix?80:0)+(pg?50:0)+{h:30,m:20,n:15,l:10}[lvl];
  return {lvl,why,score,wl,pg};
}
function sortedApps(r){return r.apps.map((a,i)=>Object.assign({i,id:a[0],req:a[1],st:a[2],wd:a[3]&&a[3].wd},{p:appInfo(r,a)})).sort((a,b)=>(a.st==='Withdrawn')-(b.st==='Withdrawn')||b.p.score-a.p.score||(a.req>b.req?1:-1))}
const applied=r=>r.apps.filter(a=>a[2]!=='Withdrawn').length;
const accepted=r=>r.apps.filter(a=>a[2]==='Accepted').length;
const seatTxt=r=>r.seats?accepted(r)+' of '+r.seats+' seats':accepted(r)+' accepted, no seat limit';
function vCourses(){
  const s=ui.sub.courses;const c=counts();
  const seg=subSeg('courses',[['rounds','Course rounds'],['seats','Seat allocation',c.triage],['attend','Record attendance']]);
  const T3={rounds:['Course rounds','Set up each round: date, fees, and when registration opens and closes. Trainees apply in the portfolio while it is open.'],seats:['Seat allocation','Decide each application. Trainees waitlisted before and trainees about to progress are shown first. The decision is yours.'],attend:['Record attendance','Check an attendance sheet before it changes any trainee record.']}[s];
  return head('Courses',T3[0],T3[1],seg)+(s==='rounds'?vRounds():s==='seats'?vSeats():vAttend());
}
const RS_RANK={open:0,closed:1,scheduled:2,held:3,recorded:4};
function vRounds(){
  const f=ui.rdF||'All',st=ui.rdS||'All';
  const all=S.rounds.slice().sort((a,b)=>RS_RANK[rState(a)]-RS_RANK[rState(b)]||(RS_RANK[rState(a)]>=3?(a.date<b.date?1:-1):(a.date>b.date?1:-1)));
  const list=all.filter(r=>(f==='All'||(f==='Mandatory'?isMand(r.course):!isMand(r.course)))&&(st==='All'||rState(r)===st));
  const stOpts=[['All','All statuses'],['open','Open'],['closed','Closed'],['scheduled','Not open yet'],['held','Held'],['recorded','Attendance recorded']];
  const act=r=>{const s=rState(r);
    const p=s==='scheduled'?`<button class="btn sec sm" data-a="openNow" data-id="${r.id}">Open now</button>`:s==='open'?`<button class="btn sec sm" data-a="closeNow" data-id="${r.id}">Close now</button>`:s==='closed'?`<button class="btn pri sm" data-a="decideRound" data-id="${r.id}">Decide seats</button>`:s==='held'?`<button class="btn pri sm" data-a="attendRound" data-id="${r.id}">Record attendance</button>`:'';
    return `<div class="btn-row" style="flex-wrap:nowrap;justify-content:flex-end">${p}<button class="btn sec sm" data-a="editRound" data-id="${r.id}" aria-label="Edit ${esc(CNAME[r.course])} ${fmtS(r.date)}">Edit</button></div>`};
  return `<div class="toolbar"><div class="chips">${['All','Mandatory','Other courses'].map(x=>{const v=x==='Other courses'?'Other':x;return `<button class="chip ${f===v?'on':''}" aria-pressed="${f===v}" data-a="rdF" data-v="${v}">${x}</button>`}).join('')}</div>
  <select data-c="rdS" aria-label="Filter by status" style="width:auto">${stOpts.map(([k,l])=>`<option value="${k}" ${st===k?'selected':''}>${l}</option>`).join('')}</select>

function suggestPlan(r){

  todo.forEach(a=>{if(free>0){acc.push(a);free--}else wl.push(a)});return {acc,wl};
}

const SHEET=`HKCA-2022-006\nHKCA-2022-010, 100\nHKCA-2023-017, 40\nHKCA-2023-004, 60\nHKCA-2023-015\nHKCA-2023-009\nHKCA-2022-099`;

function attendOut(r,rows){
  const n=k=>rows.filter(x=>x.k===k).length;const nOk=n('ok'),nW=n('warn'),nS=n('skip'),nE=n('err'),nB=n('below');
  const inc=nOk+rows.filter(x=>x.k==='warn'&&x.on).length,n50=rows.filter(x=>x.k==='below'&&x.rate<50).length,tot=inc+nB;
  const tone=x=>x.k==='below'?(x.rate<50?'bad':'warn'):{ok:'ok',warn:'warn',skip:'none',err:'bad'}[x.k];
  return `<div class="card" style="margin-top:18px"><div class="q-h"><div><div class="h3">Check result</div><div class="meta">${nOk} ready &middot; ${nW} need your decision &middot; ${nB} below 70% &middot; ${nS} already done &middot; ${nE} not recognised</div>${nB?`<div class="meta" style="margin-top:4px">${inc} will ${isMand(r.course)?'be marked completed':'be marked as attended'}. ${nB} below 70% get no certificate${n50?`; ${n50} below 50% will be reported to the Chief of Service and SOT`:''}.</div>`:''}</div><button class="btn pri sm" data-a="commitSheet" ${tot?'':'disabled'}>Record attendance${tot?' for '+tot:''}</button></div>
  <div class="tbl-scroll"><table><thead><tr><th></th><th>Number</th><th>Trainee</th><th>Result</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td style="width:34px">${x.k==='warn'?`<input type="checkbox" data-c="warnOn" data-i="${i}" ${x.on?'checked':''} aria-label="Include ${esc(x.id)}">`:''}</td><td class="mono">${esc(x.id)}</td><td>${esc(x.name||'')}</td><td>${dt(x.msg,tone(x))}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function checkSheet(){
  const r=S.rounds.find(x=>x.id===ui.cn);ui.sheet=$('#sheet').value;
  const seen={};const rows=ui.sheet.split(/\n/).map(s=>s.trim()).filter(Boolean).map(line=>{
    const p=line.split(/[\s,;]+/).filter(Boolean);const id=p[0];let rate=100,stated=false;
    const t=T(id);if(!t)return {id,k:'err',msg:'Not a known HKCA number'};
    if(p.length>1){const v=parseFloat(p[1].replace('%',''));if(p.length>2||isNaN(v)||v<0||v>100)return {id,name:t.name,k:'err',msg:'Attendance rate not understood. Use a number from 0 to 100.'};rate=v;stated=true}
    if(seen[id])return {id,name:t.name,k:'skip',msg:'Listed twice on the sheet'};seen[id]=1;
    if(isMand(r.course)&&t.courses.includes(r.course))return {id,name:t.name,k:'skip',msg:'Already has '+CNAME[r.course]+' recorded'};
    if((r.attended||[]).includes(id))return {id,name:t.name,k:'skip',msg:'Already recorded for this round'};
    if(rate<70)return {id,name:t.name,k:'below',rate,msg:'Attendance '+rate+'%. Below 70%: no certificate'+(isMand(r.course)?' and not marked completed':'')+(rate<50?'. Chief of Service and SOT will be told':'')};
    const a=r.apps.find(x=>x[0]===id);const rt=stated?' ('+rate+'%)':'';
    if(a&&a[2]==='Accepted')return {id,name:t.name,rate,k:'ok',msg:(isMand(r.course)?'Accepted for this round. Will be marked completed':'Accepted for this round. Will be marked as attended')+rt};
    return {id,name:t.name,rate,k:'warn',on:false,msg:(a?'Was '+a[2].toLowerCase()+' for this round. Tick to include':'Never applied for this round. Tick to include')+rt};
  });
  ui.sheetOut={round:r.id,rows};render();
}
function commitSheet(){
  const r=S.rounds.find(x=>x.id===ui.cn);const all=ui.sheetOut.rows;
  const good=all.filter(x=>x.k==='ok'||(x.k==='warn'&&x.on)),below=all.filter(x=>x.k==='below');
  if(isMand(r.course))good.forEach(x=>{T(x.id).courses.push(r.course)});
  r.att=r.att||{};good.concat(below).forEach(x=>{r.att[x.id]=x.rate});
  r.attended=(r.attended||[]).concat(good.map(x=>x.id));r.recorded=TODAY;
  S.notices=S.notices||[];let nn=0;
  below.filter(x=>x.rate<50).forEach(x=>{const t=T(x.id);S.notices.push({d:TODAY,id:x.id,round:r.id,rate:x.rate});nn++;logAct('Attendance below 50%',`${t.name} (${x.id}), ${CNAME[r.course]} ${fmt(r.date)}: ${x.rate}%. Notice queued to ${noticeTo(t)}`)});
  logAct('Course attendance recorded',`${CNAME[r.course]} ${fmt(r.date)}: ${good.length} ${isMand(r.course)?'marked completed':'marked as attended'}, ${below.length} below 70% without certificate`);
  ui.sheetOut=null;ui.sheet=null;render();
  toast(plural(good.length,'trainee')+(isMand(r.course)?' marked completed':' marked as attended')+(below.length?'. '+below.length+' below 70%':'')+(nn?'. '+plural(nn,'notice')+' queued.':'.'))
}
